    <table style="width:100%;border-collapse:collapse;">
      <thead><tr style="background:#f1f8e9;font-size:11px;"><th style="padding:4px 6px;text-align:left;">วันที่</th><th style="padding:4px 6px;text-align:left;">ยา</th><th style="padding:4px 6px;text-align:center;">จำนวน</th><th style="padding:4px 6px;text-align:right;">มูลค่า</th></tr></thead>
      <tbody>${retRows.slice(0,50).map(r=>`<tr style="border-bottom:1px solid #f0f0f0;"><td style="padding:3px 6px;font-size:11px;">${fmtShort(r.date)}</td><td style="padding:3px 6px;font-size:11px;">${r.name.length>20?r.name.slice(0,18)+'…':r.name}</td><td style="padding:3px 6px;text-align:center;font-size:11px;">${r.qty}</td><td style="padding:3px 6px;text-align:right;font-size:11px;">${r.value?'฿'+r.value.toLocaleString():'–'}</td></tr>`).join('')}</tbody>

// ===== SMART PATIENT SEARCH =====
function normHN(hn){ return (hn||'').trim().replace(/^0+/,'').toLowerCase(); }
function smartPtScore(item, rawQ){
  if(!rawQ) return 1;
  const q = rawQ.trim().toLowerCase();
  const qhn = normHN(q);
  const hn = (item.hn||'').toLowerCase();
  const hnn = normHN(item.hn);
  const name = (item.name||'').toLowerCase();
  // HN exact / starts / contains (normalized)
  if(hnn && qhn && hnn === qhn) return 100;
  if(hnn && qhn && hnn.startsWith(qhn)) return 90;
  if(hnn && qhn && hnn.includes(qhn)) return 80;
  if(hn.includes(q)) return 75;
  // Name exact / starts / contains
  if(name === q) return 70;
  if(name.startsWith(q)) return 65;
  if(name.includes(q)) return 60;
  // Word-level partial (Thai/space-separated)
  const qparts = q.split(/\s+/).filter(Boolean);
  if(qparts.length > 1){
    const matched = qparts.filter(p=>name.includes(p)||hnn.includes(p)).length;
    if(matched > 0) return 40 + matched*8;
  }
  // Single word partial in name
  if(q.length >= 2){
    const parts = name.split(/\s+/);
    for(const p of parts){ if(p.includes(q)||q.includes(p)&&p.length>=2) return 35; }
  }
  // Character overlap fuzzy (>=60% overlap → show as similar)
  let hits=0;
  for(const c of q){ if(name.includes(c)) hits++; }
  const ratio = hits/q.length;
  if(ratio >= 0.6) return Math.round(ratio*30);
  return 0;
}
function smartFilter(list, q, getItem){
  // getItem(x) returns {hn, name}
  if(!q) return list;
  const scored = list.map(x=>({x, score: smartPtScore(getItem(x), q)}))
                     .filter(s=>s.score>0)
                     .sort((a,b)=>b.score-a.score);
  return scored.map(s=>s.x);
}
// ===== END SMART SEARCH =====
function filterPt(q){
  const b=document.getElementById('pt-body');if(!b)return;
  const res=smartFilter(DB.patients, q, p=>p);
  if(!q) { b.innerHTML=renderPtTable(DB.patients); return; }
  if(!res.length){
    b.innerHTML='<div style="text-align:center;padding:20px;color:var(--tm);">ไม่พบผู้ป่วย — ลองค้นหาด้วย HN หรือชื่อ</div>';
  } else {
    b.innerHTML=renderPtTable(res);
  }
}

const _drugSel = {reliever:[], controller:[]};

function buildDrugMenu(cat, prefix){
  const menu = document.getElementById(prefix+'-menu');
  if(!menu) return;
  const drugs = DB.drugs.filter(d=>d.cat===cat);
  if(!drugs.length){
    menu.innerHTML='<div style="padding:10px 14px;color:var(--tm);font-size:12px;">ยังไม่มียาในระบบ — เพิ่มยาใน ฐานข้อมูลยา ก่อน</div>';
    return;
  }
  const key = prefix.includes('reliever')?'reliever':'controller';
  menu.innerHTML = drugs.map(d=>{
    const sel = _drugSel[key].includes(d.id);
    return '<div class="dmi'+(sel?' sel':'')+'" data-prefix="'+prefix+'" data-id="'+d.id+'" onclick="dmiClick(this)">'
      +'<input type="checkbox"'+(sel?' checked':'')+' onclick="event.stopPropagation();dmiClick(this.parentElement)">'
      +'<span class="dn">'+d.name+'</span>'
      +'<span class="dt">'+(d.type||'')+'</span>'
      +'</div>';
  }).join('');
}

function dmiClick(el){
  const prefix = el.dataset.prefix;
  const drugId = el.dataset.id;
  const key = prefix.includes('reliever')?'reliever':'controller';
  const arr = _drugSel[key];
  const idx = arr.indexOf(drugId);
  if(idx>=0) arr.splice(idx,1); else arr.push(drugId);
  el.classList.toggle('sel', arr.includes(drugId));
  const cb = el.querySelector('input[type=checkbox]');
  if(cb) cb.checked = arr.includes(drugId);
  updateDrugTags(prefix, key);
}

function toggleDrugMenu(prefix){
  const cat = prefix.includes('reliever')?'rescue':'controller';
  buildDrugMenu(cat, prefix);
  const menu = document.getElementById(prefix+'-menu');
  if(!menu) return;
  const isOpen = menu.style.display!=='none';
  document.querySelectorAll('.drug-ms-menu').forEach(m=>m.style.display='none');
  if(!isOpen) menu.style.display='block';
}

function updateDrugTags(prefix, key){
  const box = document.getElementById(prefix+'-box');
  const ph  = document.getElementById(prefix+'-ph');
  if(!box||!ph) return;
  const arr = _drugSel[key];
  box.querySelectorAll('.drug-tag').forEach(t=>t.remove());
  if(!arr.length){ ph.style.display=''; return; }
  ph.style.display='none';
  arr.forEach(id=>{
    const drug = DB.drugs.find(d=>d.id===id);
    if(!drug) return;
    const tag = document.createElement('span');
    tag.className = 'drug-tag';
    const nm = document.createTextNode(drug.name);
    tag.appendChild(nm);
    const xBtn = document.createElement('span');
    xBtn.className='dx'; xBtn.textContent='×';
    xBtn.dataset.prefix=prefix; xBtn.dataset.id=id;
    xBtn.onclick = function(e){
      e.stopPropagation();
      const k=this.dataset.prefix.includes('reliever')?'reliever':'controller';
      const a=_drugSel[k];
      const i=a.indexOf(this.dataset.id);
      if(i>=0) a.splice(i,1);
      const menuEl=document.getElementById(this.dataset.prefix+'-menu');
      if(menuEl&&menuEl.style.display!=='none') buildDrugMenu(k==='reliever'?'rescue':'controller',this.dataset.prefix);
      updateDrugTags(this.dataset.prefix,k);
    };
    tag.appendChild(xBtn);
    box.insertBefore(tag, box.lastElementChild);
  });
}

function getDrugNames(key){
  return _drugSel[key].map(id=>{const d=DB.drugs.find(x=>x.id===id);return d?d.name:'';}).filter(Boolean).join(', ');
}

      <b>📋 วิธีตั้งค่า Firebase (ครั้งแรก):</b><br>
      1. ไปที่ <a href="https://console.firebase.google.com" target="_blank">console.firebase.google.com</a> → Create project (ฟรี)<br>
      2. เลือก Build → Realtime Database → Create Database<br>
      3. เลือก Rules → แก้เป็น <code>{"rules":{".read":true,".write":true}}</code> (สำหรับ LAN ที่ปลอดภัย) หรือใช้ Secret Key<br>
      4. Copy Database URL (รูปแบบ <code>https://xxx.firebaseio.com</code>) มาใส่ด้านบน<br>
      5. กด "ดึงข้อมูลจาก Cloud" เพื่อทดสอบ
    </div>
    <hr style="margin:20px 0;">
    <h3 style="margin-bottom:12px;color:var(--pd);">🔄 รีเซ็ตข้อมูล</h3>
    <div class="al ald"><span>⚠️</span><span>การรีเซ็ตจะลบข้อมูลทั้งหมดออกจาก browser นี้</span></div>
    <button class="btn bd2" onclick="if(confirm('ยืนยันลบข้อมูลทั้งหมด?')){localStorage.removeItem('${SK}');location.reload();}">🗑️ รีเซ็ตข้อมูลทั้งหมด</button>
    <hr style="margin:20px 0;">
    <p style="color:var(--tm);font-size:12px;">รหัสผ่านเริ่มต้น: nurse=<code>N1234</code> | pharm=<code>P1234</code> | doctor=<code>D1234</code> | admin=<code>admin11091</code></p>
  </div>`);
}
async function saveSyncSettings(){
  SYNC.url=(document.getElementById('set-sync-url')?.value||'').trim();
  SYNC.secret=(document.getElementById('set-sync-secret')?.value||'').trim();
  SYNC.autoSync=document.getElementById('set-sync-auto')?.checked||false;
  saveSyncCfg();
  startAutoSync();
  toast('บันทึก Cloud Sync แล้ว ✅');
  // Push current data to cloud immediately
  if(SYNC.url) pushToCloud();
}
async function testPull(){
  const res=document.getElementById('sync-test-result');
  if(res) res.innerHTML='<span style="color:#1565c0;">⬇️ กำลังดึงข้อมูล...</span>';
  const ok=await pullFromCloud(false);
  if(res) res.innerHTML=ok?'<span style="color:#2e7d32;">✅ ซิงค์สำเร็จ! ข้อมูลอัปเดตแล้ว — รีเฟรชหน้าจะเห็นข้อมูลใหม่</span>':'<span style="color:#e65100;">⚠️ เชื่อมต่อได้แต่ยังไม่มีข้อมูลบน cloud</span>';
  if(ok) setTimeout(()=>location.reload(),1500);
}
function clearSyncSettings(){
  if(!confirm('ยืนยันยกเลิก Cloud Sync? ข้อมูลใน Local จะยังอยู่')) return;
  SYNC={url:'',secret:'',autoSync:false,lastSync:null,status:'idle'};
  saveSyncCfg();
  if(_autoSyncTimer){clearInterval(_autoSyncTimer);_autoSyncTimer=null;}
  setSyncStatus('idle');
  toast('ยกเลิก Cloud Sync แล้ว');
  vSettings();
}
function saveSettings(){
  const n=document.getElementById('set-nurse').value;const p=document.getElementById('set-pharm').value;
  const dr=document.getElementById('set-doctor').value;const a=document.getElementById('set-admin').value;
  if(n)DB.users.nurse=n;if(p)DB.users.pharmacist=p;if(dr)DB.users.doctor=dr;if(a)DB.users.admin=a;
  saveDB();toast('บันทึกรหัสผ่านแล้ว ✅');
}

// ---- TOAST ----
function toast(msg,type){
  const t=document.getElementById('toast');t.textContent=msg;
  t.style.background=type==='e'?'#d32f2f':'#388e3c';t.style.display='block';
  setTimeout(()=>t.style.display='none',3000);
}
