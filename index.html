<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Asthma/COPD Clinic</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--p:#1a6eb5;--pd:#0f4d8a;--pl:#e8f2fc;--s:#00897b;--sl:#e0f2f0;--ac:#f57c00;--dg:#d32f2f;--dl:#ffebee;--ok:#388e3c;--ol:#e8f5e9;--wn:#f9a825;--wl:#fffde7;--tx:#212529;--tm:#6c757d;--bd:#dee2e6;--bg:#f0f4f8;--cd:#fff;--r:10px;--sh:0 2px 12px rgba(0,0,0,.08);}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Segoe UI',Tahoma,sans-serif;font-size:14px;background:var(--bg);color:var(--tx);}
/* ---- LANDING ---- */
#pg-land{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--pd) 0%,var(--s) 100%);padding:20px;}
#pg-land h1{color:#fff;font-size:28px;font-weight:800;margin-bottom:6px;text-align:center;}
#pg-land p{color:rgba(255,255,255,.8);margin-bottom:32px;text-align:center;}
.land-cards{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;max-width:700px;}
.land-card{background:#fff;border-radius:14px;padding:24px 28px;cursor:pointer;text-align:center;width:160px;box-shadow:0 8px 32px rgba(0,0,0,.15);transition:.2s;}
.land-card:hover{transform:translateY(-4px);box-shadow:0 16px 40px rgba(0,0,0,.2);}
.land-card .lc-icon{font-size:36px;margin-bottom:10px;}
.land-card .lc-title{font-size:13px;font-weight:700;color:var(--pd);}
.land-card .lc-sub{font-size:11px;color:var(--tm);margin-top:3px;}
/* ---- APP SHELL ---- */
#app{display:none;min-height:100vh;display:flex;flex-direction:column;}
#topbar{background:linear-gradient(90deg,var(--pd),var(--p));color:#fff;padding:0 20px;height:52px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
#topbar .tb-left{display:flex;align-items:center;gap:12px;}
#topbar h1{font-size:15px;font-weight:700;}
.role-badge{padding:3px 10px;border-radius:12px;font-size:11px;font-weight:700;background:rgba(255,255,255,.2);}
#topbar .tb-right{display:flex;align-items:center;gap:8px;}
.btn-logout{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);color:#fff;padding:5px 12px;border-radius:6px;cursor:pointer;font-size:12px;}
.btn-logout:hover{background:rgba(255,255,255,.25);}
/* ---- TABS NAV ---- */
#tabnav{background:#fff;border-bottom:2px solid var(--bd);display:flex;gap:0;overflow-x:auto;padding:0 16px;}
.tnav{padding:12px 18px;font-size:13px;font-weight:600;cursor:pointer;color:var(--tm);border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap;transition:.15s;}
.tnav:hover{color:var(--p);}
.tnav.on{color:var(--p);border-bottom-color:var(--p);}
/* ---- CONTENT ---- */
#content{padding:20px;flex:1;}
.view{display:none;}.view.on{display:block;}
/* ---- CARDS ---- */
.card{background:#fff;border-radius:var(--r);box-shadow:var(--sh);padding:20px;margin-bottom:18px;}
.ch{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;padding-bottom:12px;border-bottom:2px solid var(--pl);}
.ct{font-size:15px;font-weight:700;color:var(--pd);display:flex;align-items:center;gap:7px;}
/* ---- STATS ---- */
.sgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:18px;}
.sc{background:#fff;border-radius:var(--r);padding:16px;box-shadow:var(--sh);border-left:4px solid var(--p);}
.sc.g{border-left-color:var(--s);}.sc.o{border-left-color:var(--ac);}.sc.r{border-left-color:var(--dg);}
.sv{font-size:30px;font-weight:800;color:var(--p);line-height:1;}
.sc.g .sv{color:var(--s);}.sc.o .sv{color:var(--ac);}.sc.r .sv{color:var(--dg);}
.sl2{font-size:12px;color:var(--tm);margin-top:5px;}
/* ---- FORM ---- */
.fg{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;}
.fg label{font-size:11px;font-weight:700;color:var(--tm);text-transform:uppercase;letter-spacing:.4px;}
.fg input,.fg select,.fg textarea{padding:9px 12px;border:1.5px solid var(--bd);border-radius:7px;font-size:13px;font-family:inherit;transition:.15s;background:#fff;}
.fg input:focus,.fg select:focus,.fg textarea:focus{outline:none;border-color:var(--p);box-shadow:0 0 0 3px rgba(26,110,181,.1);}
.fg textarea{resize:vertical;min-height:72px;}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;}
/* ---- BUTTONS ---- */
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:7px;font-size:13px;font-weight:600;cursor:pointer;border:none;transition:.15s;font-family:inherit;}
.bp{background:var(--p);color:#fff;}.bp:hover{background:var(--pd);}
.bs{background:var(--ok);color:#fff;}.bs:hover{background:#2e7d32;}
.bd2{background:var(--dg);color:#fff;}.bd2:hover{background:#b71c1c;}
.bo{background:transparent;color:var(--p);border:1.5px solid var(--p);}.bo:hover{background:var(--pl);}
.bw{background:var(--wn);color:#fff;}.bw:hover{background:#f57f17;}
.bsm{padding:5px 11px;font-size:12px;}
.bgray{background:#f0f0f0;color:#444;border:1px solid #ddd;}.bgray:hover{background:#e0e0e0;}
/* ---- TABLE ---- */
.tw{overflow-x:auto;}
table{width:100%;border-collapse:collapse;}
th{background:var(--pl);color:var(--pd);font-size:12px;font-weight:700;padding:9px 11px;text-align:left;white-space:nowrap;}
td{padding:9px 11px;border-bottom:1px solid var(--bd);font-size:13px;vertical-align:middle;}
tr:hover td{background:#f8fbff;}
/* ---- PILLS ---- */
.pill{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:700;}
.pg{background:var(--ol);color:var(--ok);}.py{background:var(--wl);color:#e65100;}.pr{background:var(--dl);color:var(--dg);}.pb{background:var(--pl);color:var(--p);}.pgr{background:#f0f0f0;color:#555;}
/* ---- MODAL ---- */
.mo{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:300;align-items:center;justify-content:center;}
.mo.on{display:flex;}
.mb{background:#fff;border-radius:var(--r);width:92%;max-width:680px;max-height:92vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.25);}
.mh{padding:16px 20px;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;background:linear-gradient(135deg,var(--pd),var(--p));color:#fff;border-radius:var(--r) var(--r) 0 0;}
.mh h3{font-size:15px;}
.mc{padding:20px;}
.mf{padding:12px 20px;border-top:1px solid var(--bd);display:flex;justify-content:flex-end;gap:8px;}
.mx{background:rgba(255,255,255,.2);border:none;color:#fff;width:28px;height:28px;border-radius:50%;cursor:pointer;font-size:17px;display:flex;align-items:center;justify-content:center;}
/* ---- ALERT ---- */
.al{padding:11px 14px;border-radius:7px;margin-bottom:12px;font-size:13px;display:flex;align-items:flex-start;gap:9px;}
.ali{background:var(--pl);border:1px solid #90caf9;color:var(--pd);}
.alw{background:var(--wl);border:1px solid #ffe082;color:#5d4037;}
.ald{background:var(--dl);border:1px solid #ef9a9a;color:var(--dg);}
.als{background:var(--ol);border:1px solid #a5d6a7;color:var(--ok);}
/* ---- ACT ---- */
.aq{background:#f8fbff;border:1.5px solid var(--bd);border-radius:8px;padding:14px;margin-bottom:10px;}
.aq p{font-size:13px;font-weight:600;margin-bottom:9px;}
.aopts{display:flex;gap:7px;flex-wrap:wrap;}
.ar{display:none;}.ar+label{padding:6px 12px;border:1.5px solid var(--bd);border-radius:6px;cursor:pointer;font-size:12px;transition:.15s;background:#fff;}
.ar:checked+label{background:var(--p);color:#fff;border-color:var(--p);}
/* ---- SCORE BOX ---- */
.sb{text-align:center;padding:16px;border-radius:10px;margin:10px 0;}
.sb .sn{font-size:44px;font-weight:900;line-height:1;}
.sb .sl3{font-size:13px;margin-top:5px;font-weight:600;}
.sc2{background:var(--ol);color:var(--ok);}.sp2{background:var(--wl);color:#e65100;}.su{background:var(--dl);color:var(--dg);}
/* ---- ADHERENCE ---- */
.adhq{padding:11px;border:1px solid var(--bd);border-radius:7px;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;gap:10px;}
.adhq p{font-size:13px;flex:1;}
.adhr{display:flex;gap:7px;}
.adhr input[type=radio]{display:none;}
.adhr label{padding:5px 12px;border:1.5px solid var(--bd);border-radius:5px;cursor:pointer;font-size:12px;font-weight:600;}
.adhr input:checked+label{background:var(--p);color:#fff;border-color:var(--p);}
/* ---- CANISTER STICKER ---- */
.sticker-preview{border:2px dashed var(--bd);border-radius:8px;padding:16px;margin-top:12px;}
.sticker-item{border:1.5px solid var(--p);border-radius:7px;padding:12px 14px;margin-bottom:8px;background:#fff;position:relative;}
.sticker-item.existing{border-color:var(--ac);background:#fff8f0;}
.si-drug{font-size:13px;font-weight:800;color:var(--pd);margin-bottom:4px;}
.si-detail{font-size:12px;color:var(--tx);line-height:1.7;}
.si-badge{position:absolute;top:8px;right:10px;font-size:10px;font-weight:700;padding:2px 7px;border-radius:8px;}
/* ---- DRUG CARD ---- */
.drugcard{border:1.5px solid var(--bd);border-left:4px solid var(--p);border-radius:8px;padding:13px;margin-bottom:9px;background:#fff;}
/* ---- QUEUE ITEM ---- */
.qi{border:1px solid var(--bd);border-radius:8px;padding:13px;margin-bottom:8px;cursor:pointer;transition:.15s;}
.qi:hover{border-color:var(--p);background:var(--pl);}
.qi .qih{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px;}
/* ---- PRINT ---- */
@media print{
  body{background:#fff;}
  #pg-land,#topbar,#tabnav,.no-print,.btn,.card .ch button{display:none!important;}
  #content{padding:0;}
  .card{box-shadow:none;border:1px solid #ccc;margin-bottom:8px;padding:10px;}
  .print-sticker-wrap{display:block!important;}
  .sticker-print{width:90mm;border:1.5px solid #000;padding:5mm 6mm;margin:3mm;font-size:10pt;page-break-inside:avoid;}
  .sticker-print .sp-drug{font-size:12pt;font-weight:800;margin-bottom:2mm;}
  .sticker-print .sp-row{margin-bottom:1mm;}
}
.print-sticker-wrap{display:none;}
/* ---- LOGIN ---- */
#pg-login{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:400;display:none;align-items:center;justify-content:center;}
#pg-login.on{display:flex;}
.login-box{background:#fff;border-radius:14px;padding:28px;width:90%;max-width:360px;box-shadow:0 20px 60px rgba(0,0,0,.3);}
.login-box h2{font-size:18px;font-weight:800;color:var(--pd);margin-bottom:4px;text-align:center;}
.login-box p{text-align:center;color:var(--tm);font-size:13px;margin-bottom:20px;}
/* ---- TOAST ---- */
#toast{position:fixed;bottom:20px;right:20px;padding:11px 18px;border-radius:8px;font-size:13px;z-index:500;display:none;box-shadow:0 4px 16px rgba(0,0,0,.25);color:#fff;max-width:280px;}
/* ---- RESPONSIVE ---- */
@media(max-width:600px){.fgrid{grid-template-columns:1fr;}.sgrid{grid-template-columns:1fr 1fr;}}
</style>
</head>
<body>

<!-- ============ LANDING ============ -->
<div id="pg-land">
  <div style="font-size:52px;margin-bottom:10px;">🫁</div>
  <h1>Asthma/COPD Clinic</h1>
  <p>ระบบบันทึกและติดตามโรคหอบหืด</p>
  <div class="land-cards">
    <div class="land-card" onclick="goPublic()">
      <div class="lc-icon">📋</div>
      <div class="lc-title">ผู้ป่วย / อสม.</div>
      <div class="lc-sub">กรอกแบบประเมิน</div>
    </div>
    <div class="land-card" onclick="showLogin('nurse')">
      <div class="lc-icon">👩‍⚕️</div>
      <div class="lc-title">พยาบาล</div>
      <div class="lc-sub">ยืนยันข้อมูลผู้ป่วย</div>
    </div>
    <div class="land-card" onclick="showLogin('pharmacist')">
      <div class="lc-icon">💊</div>
      <div class="lc-title">เภสัชกร</div>
      <div class="lc-sub">จ่ายยา / คำนวณ</div>
    </div>
    <div class="land-card" onclick="showLogin('doctor')">
      <div class="lc-icon">🩺</div>
      <div class="lc-title">แพทย์</div>
      <div class="lc-sub">ดูสรุป / Plan</div>
    </div>
    <div class="land-card" onclick="showLogin('admin')">
      <div class="lc-icon">⚙️</div>
      <div class="lc-title">Admin</div>
      <div class="lc-sub">จัดการระบบ</div>
    </div>
  </div>
</div>

<!-- ============ LOGIN MODAL ============ -->
<div id="pg-login">
  <div class="login-box">
    <h2 id="login-title">เข้าสู่ระบบ</h2>
    <p id="login-sub">กรอกรหัสผ่านเพื่อเข้าใช้งาน</p>
    <div class="fg"><label>รหัสผ่าน</label>
      <input type="password" id="login-pw" placeholder="รหัสผ่าน" onkeydown="if(event.key==='Enter')doLogin()">
    </div>
    <div id="login-err" class="al ald" style="display:none"><span>❌</span><span>รหัสผ่านไม่ถูกต้อง</span></div>
    <div style="display:flex;gap:8px;margin-top:4px;">
      <button class="btn bp" style="flex:1" onclick="doLogin()">เข้าสู่ระบบ</button>
      <button class="btn bgray" onclick="closeLogin()">ยกเลิก</button>
    </div>
  </div>
</div>

<!-- ============ APP SHELL ============ -->
<div id="app" style="display:none">
  <div id="topbar">
    <div class="tb-left">
      <span style="font-size:22px;">🫁</span>
      <h1>Asthma Clinic</h1>
      <span class="role-badge" id="role-badge"></span>
    </div>
    <div class="tb-right">
      <span style="font-size:12px;color:rgba(255,255,255,.7);" id="tb-date"></span>
      <button class="btn-logout" onclick="doLogout()">ออกจากระบบ</button>
    </div>
  </div>
  <div id="tabnav"></div>
  <div id="content"></div>
</div>

<!-- ============ TOAST ============ -->
<div id="toast"></div>

<script>
// ==================== DATA ====================
const SK = 'asthma_v2';
let DB = {patients:[],visits:[],dispensing:[],drugs:[],users:{nurse:'nurse1234',pharmacist:'pharm1234',admin:'admin1234'}};
let SESSION = {role:null}; // public/nurse/pharmacist/admin
let loginTarget = '';

function loadDB(){try{const d=localStorage.getItem(SK);if(d)DB=JSON.parse(d);}catch(e){}}
function saveDB(){try{localStorage.setItem(SK,JSON.stringify(DB));}catch(e){}}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function today(){return new Date().toISOString().split('T')[0];}
function fmt(d){if(!d)return'–';const dt=new Date(d);if(isNaN(dt))return'–';const dd=String(dt.getDate()).padStart(2,'0');const mm=String(dt.getMonth()+1).padStart(2,'0');const yy=dt.getFullYear()+543;return`${dd}/${mm}/${yy}`;}
function addDays(d,n){const r=new Date(d);r.setDate(r.getDate()+n);return r;}
// ---- Thai date INPUT helpers (DD/MM/YYYY CE) ----
function parseTH(val){
  if(!val)return'';
  // Already ISO
  if(/^\d{4}-\d{2}-\d{2}$/.test(val))return val;
  const m=val.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/);
  if(!m)return val;
  let d=parseInt(m[1]),mo=parseInt(m[2]),y=parseInt(m[3]);
  if(y<100)y+=2500;
  if(y>2400)y-=543;
  return`${y}-${String(mo).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
}
function setTH(id,iso){
  const el=typeof id==='string'?document.getElementById(id):id;
  if(!el)return;
  if(!iso){el.value='';return;}
  const dt=new Date(iso);
  if(isNaN(dt)){el.value='';return;}
  const dd=String(dt.getDate()).padStart(2,'0');
  const mm=String(dt.getMonth()+1).padStart(2,'0');
  el.value=`${dd}/${mm}/${dt.getFullYear()}`;
}
function setTHVal(iso){
  if(!iso)return'';
  const dt=new Date(iso);if(isNaN(dt))return'';
  return`${String(dt.getDate()).padStart(2,'0')}/${String(dt.getMonth()+1).padStart(2,'0')}/${dt.getFullYear()}`;
}
function todayTH(){const n=new Date();return`${String(n.getDate()).padStart(2,'0')}/${String(n.getMonth()+1).padStart(2,'0')}/${n.getFullYear()}`;}
function addDaysTH(isoOrDate,n){
  const d=typeof isoOrDate==='string'?new Date(isoOrDate):isoOrDate;
  d.setDate(d.getDate()+n);
  return`${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`;
}
// Thai date label helpers
const THAI_MONTHS=['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
function thaiDateLabel(iso){
  if(!iso)return'';
  const dt=new Date(iso);
  if(isNaN(dt))return'';
  return`${dt.getDate()} ${THAI_MONTHS[dt.getMonth()]} ${dt.getFullYear()+543}`;
}
function syncThaiLabel(id){
  const el=document.getElementById(id);
  const lbl=document.getElementById(id+'-th');
  if(el&&lbl)lbl.textContent=thaiDateLabel(el.value);
}
function diffDays(a,b){return Math.round((new Date(b)-new Date(a))/(86400000));}

// ==================== DEFAULT DRUGS ====================
const DEFAULT_DRUGS=[
  {id:'d1',name:'Salbutamol MDI 100mcg (Ventolin)',dose:'100',puffs:200,type:'SABA',cat:'rescue',brand:'Ventolin',color:'#2196F3'},
  {id:'d2',name:'Salbutamol Turbuhaler',dose:'100',puffs:200,type:'SABA',cat:'rescue',brand:'Bricanyl',color:'#2196F3'},
  {id:'d3',name:'Budesonide 200mcg (Pulmicort)',dose:'200',puffs:100,type:'ICS',cat:'controller',brand:'Pulmicort',color:'#4CAF50'},
  {id:'d4',name:'Fluticasone 50mcg (Flixotide)',dose:'50',puffs:120,type:'ICS',cat:'controller',brand:'Flixotide',color:'#4CAF50'},
  {id:'d5',name:'Fluticasone 125mcg (Flixotide)',dose:'125',puffs:120,type:'ICS',cat:'controller',brand:'Flixotide',color:'#4CAF50'},
  {id:'d6',name:'Fluticasone 250mcg (Flixotide)',dose:'250',puffs:120,type:'ICS',cat:'controller',brand:'Flixotide',color:'#4CAF50'},
  {id:'d7',name:'Budesonide/Formoterol 80/4.5 (Symbicort)',dose:'80/4.5',puffs:120,type:'ICS/LABA',cat:'controller',brand:'Symbicort',color:'#9C27B0'},
  {id:'d8',name:'Budesonide/Formoterol 160/4.5 (Symbicort)',dose:'160/4.5',puffs:120,type:'ICS/LABA',cat:'controller',brand:'Symbicort',color:'#9C27B0'},
  {id:'d9',name:'Fluticasone/Salmeterol 25/50 (Seretide)',dose:'25/50',puffs:120,type:'ICS/LABA',cat:'controller',brand:'Seretide',color:'#9C27B0'},
  {id:'d10',name:'Fluticasone/Salmeterol 25/125 (Seretide)',dose:'25/125',puffs:120,type:'ICS/LABA',cat:'controller',brand:'Seretide',color:'#9C27B0'},
  {id:'d11',name:'Tiotropium (Spiriva)',dose:'18',puffs:30,type:'LAMA',cat:'controller',brand:'Spiriva',color:'#FF9800'},
  {id:'d12',name:'Ipratropium (Atrovent)',dose:'20',puffs:200,type:'SAMA',cat:'rescue',brand:'Atrovent',color:'#FF5722'},
];

// ==================== BOOT ====================
loadDB();
if(!DB.drugs||!DB.drugs.length) DB.drugs=[...DEFAULT_DRUGS];
if(!DB.users) DB.users={nurse:'nurse1234',pharmacist:'pharm1234',admin:'admin1234'};
if(!DB.dispensing) DB.dispensing=[];
if(!DB.rescueLog) DB.rescueLog=[];
if(DB.patients.length===0) loadDemoData();
saveDB();
const _now=new Date();const _wd=_now.toLocaleDateString('th-TH',{weekday:'short'});const _dd=String(_now.getDate()).padStart(2,'0');const _mm=String(_now.getMonth()+1).padStart(2,'0');const _yy=_now.getFullYear()+543;document.getElementById('tb-date').textContent=`${_wd} ${_dd}/${_mm}/${_yy}`;

// ==================== HASH ROUTING (QR rescue) ====================
function handleHash(){
  const h=location.hash;
  if(h.startsWith('#rescue-')){
    const hn=decodeURIComponent(h.slice(8));
    vRescueLogForm(hn);
  }
}
window.addEventListener('hashchange',handleHash);
window.addEventListener('load',()=>{if(location.hash.startsWith('#rescue-'))handleHash();});

// ==================== AUTH ====================
function showLogin(role){
  loginTarget=role;
  const titles={nurse:'พยาบาล',pharmacist:'เภสัชกร',admin:'Admin'};

function calcACT(){
  let t=0,a=0;for(let i=0;i<5;i++){const s=document.querySelector(`input[name="ac${i}"]:checked`);if(s){t+=+s.value;a++;}}
  const d=document.getElementById('act-res');if(!d)return 0;
  if(a===5){let c,l;if(t===25){c='sc2';l='✅ Completely Controlled';}else if(t>=20){c='sp2';l='⚡ Well Controlled';}else{c='su';l='❌ Not Controlled';}
    d.innerHTML=`<div class="sb ${c}"><div class="sn">${t}</div><div class="sl3">${l}</div></div>`;}
  return t;
}
function calcAdh(){

}

  const d=document.getElementById('cat-res');if(!d)return 0;

function calcmMRC(){
  const s=document.querySelector('input[name="mmrc"]:checked');
  const d=document.getElementById('mmrc-res');
  if(s&&d){
    const g=+s.value;
    const cls=g>=2?'su':'sp2';
    d.innerHTML=`<div class="sb ${cls}" style="margin-top:8px;"><div class="sn">Grade ${g}</div><div class="sl3">mMRC – ${MMRC_OPTS[g].desc}</div></div>`;
  }
  return s?+s.value:null;
}

function onDxChange(){
  const dx=document.getElementById('a-dx')?.value||'Asthma';
  const isAsthma=dx==='Asthma'||dx==='ACO';
  const isCOPD=dx==='COPD'||dx==='ACO';
  const actCard=document.getElementById('act-card');
  const catCard=document.getElementById('cat-card');
  const mmrcCard=document.getElementById('mmrc-card');
  const hdr=document.querySelector('h2');
  if(actCard) actCard.style.display=isAsthma?'block':'none';
  if(catCard) catCard.style.display=isCOPD?'block':'none';
  if(mmrcCard) mmrcCard.style.display=isCOPD?'block':'none';
  // Update form header subtitle
  const sub=document.querySelector('[style*="opacity:.85"]');
  const dxLabel=dx==='ACO'?'COPD + Asthma (ACO)':dx;
  if(sub&&sub.tagName==='P') sub.textContent=`การวินิจฉัย: ${dxLabel} · กรอกข้อมูลอาการใน 4 สัปดาห์ที่ผ่านมา`;
}

function aFillName(){
  const hn=(document.getElementById('a-hn')||{}).value?.trim();
  const p=DB.patients.find(x=>x.hn===hn);
  if(p){
    if(document.getElementById('a-name'))document.getElementById('a-name').value=p.name;
    const dxSel=document.getElementById('a-dx');
    if(dxSel&&p.dx){
      const normalized=normalizeDx(p.dx);
      dxSel.value=normalized;
      onDxChange();
    }
  }
}
function normalizeDx(dx){
  if(!dx)return'Asthma';
  const d=dx.toLowerCase();
  if(d.includes('aco')||d.includes('overlap')||(d.includes('copd')&&d.includes('asthma')))return'ACO';
  if(d.includes('copd'))return'COPD';
  return'Asthma';
}
function submitAssess(){
  const hn=(document.getElementById('a-hn')||{}).value?.trim();
  const name=(document.getElementById('a-name')||{}).value?.trim();
  if(!hn||!name){toast('กรุณากรอก HN และชื่อ','e');return;}
  const day=+(document.getElementById('a-day').value||0);
  const night=+(document.getElementById('a-night').value||0);
  const act=calcACT();const adh=calcAdh();
  const rec={id:uid(),type:'assessment',hn,name,
    date:document.getElementById('a-date')?.value||today(),
    by:document.getElementById('a-by').value,
    caregiver:document.getElementById('a-caregiver')?.value||'',
    nurseName:document.getElementById('a-nurse-name')?.value||'',
    daytime:day,nighttime:night,
    rescue:+(document.getElementById('a-rescue').value||0),
    activity:+(document.getElementById('a-act').value||0),
    erCount:+(document.getElementById('a-er').value||0),
    opdCount:+(document.getElementById('a-opd').value||0),
    admitCount:+(document.getElementById('a-admit').value||0),
    dx:document.getElementById('a-dx')?.value||'Asthma',
    actScore:act||null,
    catScore:calcCAT()||null,
    mmrc:calcmMRC()??null,
    adherenceScore:(day+night>=2)?adh:null,
    notes:document.getElementById('a-notes').value,
    status:'pending_nurse',
    createdAt:new Date().toISOString()
  };
  const _dxVal=document.getElementById('a-dx')?.value||'Asthma';
  const existPt=DB.patients.find(p=>p.hn===hn);
  if(!existPt)DB.patients.push({id:uid(),hn,name,dx:_dxVal,createdAt:new Date().toISOString()});
  else if(_dxVal&&_dxVal!==existPt.dx){existPt.dx=_dxVal;}
  DB.visits.push(rec);saveDB();
  document.querySelector('#content > div').style.display='none';
  document.getElementById('assess-ok').style.display='block';
  toast('ส่งข้อมูลเรียบร้อย ✅');
}

// ---- DX HELPERS ----
function getPatDx(hn){const p=DB.patients.find(x=>x.hn===hn);return p?.dx||'Asthma';}
function normalizeDx(dx){
  if(!dx)return'Asthma';
  const d=dx.toLowerCase();
  if(d.includes('aco')||d.includes('overlap')||(d.includes('copd')&&d.includes('asthma')))return'ACO';
  if(d.includes('copd'))return'COPD';
  return'Asthma';
}
function dxPill(dx){
  const n=normalizeDx(dx||'');
  if(n==='COPD')return'<span class="pill po" style="font-size:10px;">🫁 COPD</span>';
  if(n==='ACO')return'<span class="pill" style="font-size:10px;background:#ede7f6;color:#4527a0;">🔵 ACO</span>';
  return'<span class="pill pb" style="font-size:10px;">🌬️ Asthma</span>';
}
function scoreLabel(v){
  const dx=normalizeDx(v.dx||getPatDx(v.hn));
  const parts=[];
  if((dx==='Asthma'||dx==='ACO')&&v.actScore) parts.push('ACT: '+v.actScore);
  if((dx==='COPD'||dx==='ACO')&&v.catScore) parts.push('CAT: '+v.catScore);
  if((dx==='COPD'||dx==='ACO')&&v.mmrc!=null) parts.push('mMRC: '+v.mmrc);
  return parts.length?parts.join(' · '):'–';
}
// ---- NURSE QUEUE ----
function vNurseQueue(){
  const pending=DB.visits.filter(v=>v.status==='pending_nurse').sort((a,b)=>new Date(a.createdAt)-new Date(b.createdAt));
  // For imported patients: check if they already submitted self-assessment
  function hasSelfAssess(hn){
    return DB.visits.some(v=>v.hn===hn&&v.by==='patient'&&(v.actScore||v.daytime!=null));
  }
  setContent(`
  <div class="card">
    ${getRescueAlertBanner()}
    <div class="ch">
      <span class="ct">📥 คิวพยาบาลคัดกรอง</span>
      <span class="pill pr">${pending.length} ราย</span>
    </div>
    ${pending.length?`
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;">
      <button class="btn bs bsm" onclick="fwdAllNurse('doctor')">➡️ ส่งทั้งหมดไปแพทย์</button>
      <button class="btn bo bsm" onclick="fwdAllNurse('pharm')">➡️ ส่งทั้งหมดไปเภสัช</button>
      <button class="btn bd2 bsm" onclick="clearQueue('nurse')">🗑️ เคลียร์คิว</button>
    </div>`:''}
    ${!pending.length?'<div style="text-align:center;padding:30px;color:var(--tm);">✅ ไม่มีผู้ป่วยในคิว</div>':
    pending.map(v=>{
      const assessed=hasSelfAssess(v.hn);
      const isImport=v.type==='import_queue';
      return`<div class="qi" onclick="openNurseVerify('${v.id}')">
        <div class="qih">
          <span><strong>${v.hn}</strong> – ${v.name}
            ${isImport?'<span class="pill pb" style="font-size:10px;margin-left:4px;">📋 นัดวันนี้</span>':''}</span>
          <span>${assessed?'<span class="pill pg" style="font-size:10px;">✅ ส่งแบบประเมินแล้ว</span>':'<span class="pill py" style="font-size:10px;">⏳ ยังไม่ประเมิน</span>'}</span>
        </div>
        <div style="font-size:12px;color:var(--tm);">📅 ${fmt(v.date)} · ACT: ${v.actScore||'–'} · หอบ: ${v.daytime||0}/${v.nighttime||0} · บันทึกโดย: ${v.by==='nurse'?'พยาบาล'+(v.nurseName?' ('+v.nurseName+')':''):v.by||'ผู้ป่วย'}</div>
      </div>`;}).join('')}
  </div>`);
}
function fwdAllNurse(dest){
  if(!confirm(dest==='doctor'?'ส่งผู้ป่วยทั้งหมดไปพบแพทย์?':'ส่งผู้ป่วยทั้งหมดไปเภสัชโดยตรง?')) return;
  const target=dest==='doctor'?'pending_doctor':'pending_pharm';
  DB.visits.filter(v=>v.status==='pending_nurse').forEach(v=>{v.status=target;v.nurseVerified=true;v.nurseAt=new Date().toISOString();});
  saveDB();vNurseQueue();toast(`ส่งทั้งหมดไปที่${dest==='doctor'?'แพทย์':'เภสัช'}แล้ว ✅`,'s');
}
function clearQueue(role){
  const statusMap={nurse:'pending_nurse',pharm:'pending_pharm',doctor:'pending_doctor'};
  const st=statusMap[role];
  if(!st||!confirm('เคลียร์คิวทั้งหมด? (จะ mark ว่าเสร็จสิ้น)')) return;
  DB.visits.filter(v=>v.status===st).forEach(v=>{v.status='done';v.clearedAt=new Date().toISOString();});
  saveDB();
  if(role==='nurse') vNurseQueue();
  else if(role==='doctor') vDoctorSummary();
  else vPhQueue();
  toast('เคลียร์คิวแล้ว','s');
}

}
function drNoteChip(vid,text){
  const ta=document.getElementById('dr-note-'+vid);
  if(!ta) return;
  if(text==='อื่นๆ (ระบุ)'){ta.focus();return;}
  const cur=ta.value.trim();
  // toggle: if already in text remove it, else add
  if(cur.includes(text)){
    ta.value=cur.replace(text,'').replace(/^[,;\s]+|[,;\s]+$/g,'').replace(/,\s*,/g,',');
  } else {
    ta.value=cur?cur+'; '+text:text;
  }
  // highlight active chips
  const chips=document.querySelectorAll(`#dr-note-chips-${vid} button`);
  chips.forEach(b=>{
    const active=ta.value.includes(b.textContent);
    b.style.background=active?'var(--ac)':'#fff';
    b.style.color=active?'#fff':'var(--p)';
  });
}

function addPhDrugFromHistory(disp){
  if(!disp||!disp.drugs) return addPhDrug();
  (disp.drugs||[]).forEach(d=>{
    // find last empty date of last canister for this drug
    const cans=d.canisters||[];
    const newCans=cans.filter(c=>!c.isOld);
    const lastEnd=newCans.length?newCans[newCans.length-1].end:null;
    addPhDrug({...d,mode:'cont',lastEmptyDate:d.lastEmptyDate||(lastEnd?new Date(lastEnd).toISOString().split('T')[0]:null)});
  });
  if(!disp.drugs||!disp.drugs.length) addPhDrug();
}

function calcSingle(id){
  const drugSel=document.getElementById(id+'-drug');
  const drug=DB.drugs.find(d=>d.id===drugSel?.value)||DB.drugs[0];
  const dose=+(document.getElementById(id+'-dose')?.value||2);
  const freq=+(document.getElementById(id+'-freq')?.value||2);
  const ppc=+(document.getElementById(id+'-ppc')?.value||200);
  const mode=document.getElementById(id+'-mode')?.value||'new';
  const nextAppt=document.getElementById('ph-next')?.value||addDays(today(),90).toISOString().split('T')[0];
  const dispDate=document.getElementById('ph-date')?.value||today();
  const daily=dose*freq;
  const daysToAppt=Math.max(1,diffDays(dispDate,nextAppt));
  let canisters=[];

  // ---- RESCUE (PRN) short-circuit ----
  const isRescue=drug&&(drug.cat==='rescue'||guessDrugCat(drug.name||'')==='rescue');
  if(isRescue){
    const qty=+(document.getElementById(id+'-qty')?.value||1);
    for(let i=0;i<qty;i++){
      canisters.push({num:`กระบอกที่ ${i+1}`,start:new Date(dispDate),end:new Date(nextAppt),
        puffs:ppc,puffsPerCan:ppc,isOld:false,dose,freq:0,drug:drug.name,isPRN:true});
    }
    return{drug:drug.name,isRescue:true,qty,dose,ppc,canisters,noDispense:false,daysToAppt};
  }

  if(mode==='cont'){
    const expEmpty=document.getElementById(id+'-expempty')?.value||'';
    if(!expEmpty) return {drug:drug?.name,daily,daysToAppt,canisters:[],noDispense:false,noDate:true};
    const expEmptyD=new Date(expEmpty);
    const nextApptD=new Date(nextAppt);
    // If existing canister outlasts next appointment → no new dispensing needed
    if(expEmptyD>=nextApptD){
      return {drug:drug?.name,daily,daysToAppt,canisters:[],noDispense:true,expEmpty,dose,freq};
    }
    // New canisters start the day AFTER expected empty date
    const daysNeeded=Math.max(1,diffDays(expEmpty,nextAppt));
    const puffsNeeded=daysNeeded*daily;
    const n=Math.ceil(puffsNeeded/ppc);
    let startDate=addDays(expEmpty,1);
    for(let i=0;i<n;i++){
      const dur=Math.floor(ppc/daily);
      const end=addDays(startDate,dur-1);
      canisters.push({num:`กระบอกที่ ${i+1}`,start:new Date(startDate),end,puffs:ppc,isOld:false,dose,freq,drug:drug?.name});
      startDate=addDays(startDate,dur);
    }
    return {drug:drug?.name,daily,daysToAppt,canisters,noDispense:false,expEmpty,dose,freq};
  } else {
    // New prescription: start from dispDate
    const totalPuffs=daysToAppt*daily;
    const n=Math.ceil(totalPuffs/ppc);
    let startDate=new Date(dispDate);
    for(let i=0;i<n;i++){
      const dur=Math.floor(ppc/daily);
      const end=addDays(startDate,dur-1);
      canisters.push({num:`กระบอกที่ ${i+1}`,start:new Date(startDate),end,puffs:ppc,isOld:false,dose,freq,drug:drug?.name});
      startDate=addDays(startDate,dur);
    }
    return {drug:drug?.name,daily,daysToAppt,canisters,noDispense:false,dose,freq};
  }
}
function calcAll(){
  const ids=Array.from(document.getElementById('ph-drug-list')?.children||[]).map(el=>el.id);
  let allCanisters=[];let allResults=[];
  ids.forEach(id=>{
    const res=calcSingle(id);
    if(!res)return;
    allResults.push(res);
    let html='';
    if(res.noDate){
      html=`<div style="background:var(--wl);border:1px solid #ffe082;border-radius:6px;padding:8px 12px;">⚠️ กรุณากรอกวันที่คาดว่ายาจะหมด</div>`;
    } else if(res.noDispense){
      html=`<div style="background:var(--ol);border:1px solid #a5d6a7;border-radius:6px;padding:8px 12px;">✅ <strong>ไม่ต้องจ่ายยาเพิ่ม</strong> – ยาเดิมยังพอถึงวันนัด (หมดประมาณ ${fmtShort(res.expEmpty)})</div>`;
    } else if(res.isRescue){
      html=`<div style="background:#fff3f3;border:1px solid #ef9a9a;border-radius:6px;padding:8px 12px;">
        <strong style="color:#c62828;">${res.drug}</strong> – 🚨 พ่นเมื่อมีอาการ (PRN)<br>
        <span style="color:var(--ok);">จ่าย: <strong>${res.qty} กระบอก</strong></span>
        <span style="color:var(--tm);font-size:12px;"> · ครั้งละ ${res.dose} puffs · ${res.ppc} puffs/กระบอก (≈${Math.floor(res.ppc/res.dose)} ครั้ง)</span>
      </div>`;
    } else {
      html=`<div style="background:var(--ol);border:1px solid #a5d6a7;border-radius:6px;padding:8px 12px;">
        <strong>${res.drug}</strong> – ${res.daily} puffs/วัน<br>
        <span style="color:var(--ok);">จ่ายใหม่: <strong>${res.canisters.length} กระบอก</strong></span>
        ${res.expEmpty?`<br><span style="color:var(--tm);font-size:12px;">เริ่มกระบอกที่ 1 วันที่ ${res.canisters.length?fmtShort(res.canisters[0].start):'–'}</span>`:''}
      </div>`;
    }
    const r=document.getElementById(id+'-result');
    if(r) r.innerHTML=html;
    allCanisters.push(...res.canisters.map(c=>({...c,drugName:res.drug})));
  });
  const totalNew=allCanisters.filter(c=>!c.isOld).length;
  const noDispAll=allResults.length&&allResults.every(r=>r.noDispense);
  const res=document.getElementById('ph-calc-result');
  if(res&&(allCanisters.length||allResults.length)){
    if(noDispAll){
      res.innerHTML=`<div class="al als"><span>✅</span><span><strong>ไม่ต้องจ่ายยาเพิ่มทุกรายการ</strong> – ยาเดิมยังพอถึงวันนัดครั้งถัดไป</span></div>`;
    } else {
      res.innerHTML=`<div class="al als"><span>📊</span><span><strong>สรุป:</strong> จ่ายใหม่รวม <strong>${totalNew} กระบอก</strong> | ยา ${ids.length} รายการ</span></div>`;
    }
  }
  window._calcResult={allCanisters,allResults,noDispAll};
}
function fmtShort(d){if(!d)return'–';const dt=new Date(d);if(isNaN(dt))return'–';const dd=String(dt.getDate()).padStart(2,'0');const mm=String(dt.getMonth()+1).padStart(2,'0');const yy=dt.getFullYear()+543;return`${dd}/${mm}/${yy}`;}

function saveDispensing(){
  const hn=document.getElementById('ph-hn')?.value?.trim();
  const name=document.getElementById('ph-name')?.value?.trim();
  if(!hn){toast('กรุณากรอก HN','e');return;}
  const ids=Array.from(document.getElementById('ph-drug-list')?.children||[]).map(el=>el.id);
  const cResult=window._calcResult||{};
  const drugs=ids.map(id=>{
    const drugSel=document.getElementById(id+'-drug');
    const drug=DB.drugs.find(d=>d.id===drugSel?.value);
    const thisCans=(cResult.allCanisters||[]).filter(c=>(c.drug||c.drugName)===drug?.name);
    const newCans=thisCans.filter(c=>!c.isOld);
    // Store last canister end date for next visit auto-fill
    const lastEmptyDate=newCans.length?new Date(newCans[newCans.length-1].end).toISOString().split('T')[0]:null;
    return {drugId:drug?.id,drug:drug?.name,
      dose:+(document.getElementById(id+'-dose')?.value||2),
      freq:+(document.getElementById(id+'-freq')?.value||2),
      ppc:+(document.getElementById(id+'-ppc')?.value||200),
      mode:document.getElementById(id+'-mode')?.value||'new',
      expEmpty:document.getElementById(id+'-expempty')?.value||null,
      qty:+(document.getElementById(id+'-qty')?.value||1),
      isPRN:document.getElementById(id+'-prn-wrap')?.style.display!=='none',
      lastEmptyDate,canisters:thisCans
    };
  });
  DB.dispensing.push({id:uid(),hn,name,date:document.getElementById('ph-date')?.value||today(),
    nextAppt:document.getElementById('ph-next')?.value||'',drugs,
    noDispense:cResult.noDispAll||false,
    createdAt:new Date().toISOString()});
  if(phVisitId){const v=DB.visits.find(x=>x.id===phVisitId);if(v){v.status='done';v.pharmAt=new Date().toISOString();}}
  if(!DB.patients.find(p=>p.hn===hn)) DB.patients.push({id:uid(),hn,name,dx:'Asthma',createdAt:new Date().toISOString()});
  saveDB();toast('บันทึกการจ่ายยาแล้ว ✅');
}

function handleImportFile(input){
  const file=input.files[0];
  if(!file){return;}
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array',cellDates:true});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:'',raw:false});
      if(rows.length<2){toast('ไม่พบข้อมูลในไฟล์','error');return;}
      previewImport(rows);
    }catch(err){toast('อ่านไฟล์ไม่ได้: '+err.message,'error');}
  };
  reader.readAsArrayBuffer(file);
}

function parseImportDate(val){
  if(!val) return null;
  const s=String(val).trim();
  if(!s||s==='-'||s==='–') return null;
  // ISO YYYY-MM-DD
  if(/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
  // D/M/YY or D/M/YYYY (Thai BE)
  const m4=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/);
  if(m4){
    let yr=parseInt(m4[3]);
    if(yr<100) yr+=2500;      // 2-digit BE: 69 → 2569
    if(yr>2400) yr-=543;      // BE → CE: 2569 → 2026
    return `${yr}-${m4[2].padStart(2,'0')}-${m4[1].padStart(2,'0')}`;
  }
  const d=new Date(s);
  if(!isNaN(d)) return d.toISOString().split('T')[0];
  return null;
}

// Auto-detect drug category from name
function guessDrugCat(name){
  const n=name.toLowerCase();
  const rescueKeys=['salbutamol','ventolin','berodual','bricanyl','ipratropium','atrovent','terbutaline','albuterol'];
  return rescueKeys.some(k=>n.includes(k))?'rescue':'controller';
}

function previewImport(rows){
  if(!rows||rows.length<2){toast('ไฟล์ไม่มีข้อมูล','error');return;}

  // Skip note row if row[1] starts with ⚠️
  let dataStart=1;
  if(rows[1]&&String(rows[1][0]||'').includes('⚠️')) dataStart=2;

  const hdr=rows[0].map(h=>String(h||'').replace(/\n.*/,'').toLowerCase().trim());

  // Header detection - support both new and old template formats
  function col(...keys){
    const i=hdr.findIndex(h=>keys.some(k=>h.includes(k)));
    return i>=0?i:-1;
  }
  const ci={
    date:    col('ว-ค-ป','วันที่','date'),
    name:    col('ชื่อผู้ป่วย','ชื่อ-นาม','ชื่อ','name'),
    hn:      col('hn','รหัส'),
    age:     col('อายุ','age'),
    drug:    col('ยาพ่น','ชื่อยา','drug'),
    nextAppt:col('วันนัด','next'),
    ppc:     col('puffs/กระบอก','puffs/can'),
    dpu:     col('พ่น/ครั้ง','dose per'),
    fpd:     col('ครั้ง/วัน','freq'),
    exp:     col('คาดว่า','exp','หมด'),
    dx:      col('วินิจ','diag'),
  };
  // Positional fallback: date,name,hn,age,drug,next,ppc,dpu,fpd,exp
  if(ci.date<0)    ci.date=0;
  if(ci.name<0)    ci.name=1;
  if(ci.hn<0)      ci.hn=2;
  if(ci.age<0)     ci.age=3;
  if(ci.drug<0)    ci.drug=4;
  if(ci.nextAppt<0)ci.nextAppt=5;
  if(ci.ppc<0)     ci.ppc=6;
  if(ci.dpu<0)     ci.dpu=7;
  if(ci.fpd<0)     ci.fpd=8;
  if(ci.exp<0)     ci.exp=9;

  const ptMap={};
  for(let i=dataStart;i<rows.length;i++){
    const r=rows[i];
    const hnRaw=String(r[ci.hn]||'').trim();
    if(!hnRaw) continue;
    if(!ptMap[hnRaw]){
      ptMap[hnRaw]={
        hn:hnRaw,
        name:String(r[ci.name]||'').trim(),
        age:parseInt(r[ci.age])||0,
        dx:normalizeDx(ci.dx>=0?String(r[ci.dx]||'Asthma').trim():'Asthma'),
        visitDate:parseImportDate(r[ci.date])||today(),
        nextAppt:parseImportDate(r[ci.nextAppt])||addDays(today(),90).toISOString().split('T')[0],
        drugs:[]
      };
    }
    const drugName=String(r[ci.drug]||'').trim();
    if(drugName){
      const cat=guessDrugCat(drugName);
      ptMap[hnRaw].drugs.push({
        name:drugName,
        cat,
        ppc:parseInt(r[ci.ppc])||200,
        dosePerUse:parseInt(r[ci.dpu])||2,
        freqPerDay:parseInt(r[ci.fpd])||(cat==='rescue'?0:2),
        expEmpty:parseImportDate(r[ci.exp])||null,
      });
    }
  }

  const pts=Object.values(ptMap);
  if(!pts.length){toast('ไม่พบข้อมูลที่อ่านได้ กรุณาตรวจสอบ format','error');return;}
  window._importData=pts;

  const prev=document.getElementById('import-preview');
  if(!prev) return;
  prev.innerHTML=`
    <div class="ch" style="margin:12px 0 8px;">
      <span class="ct" style="font-size:14px;">👁️ ตรวจสอบข้อมูลก่อนนำเข้า</span>
      <span class="pill pb">${pts.length} ผู้ป่วย · ${pts.reduce((a,p)=>a+p.drugs.length,0)} รายการยา</span>
    </div>
    <div class="tw" style="margin-bottom:14px;">
      <table><thead><tr>
        <th>HN</th><th>ชื่อผู้ป่วย</th><th>อายุ</th><th>วันนัด</th><th>ยาพ่น</th>
      </tr></thead><tbody>
      ${pts.map(p=>`<tr>
        <td><strong>${p.hn}</strong></td>
        <td>${p.name}</td>
        <td style="text-align:center">${p.age||'–'}</td>
        <td>${fmt(p.nextAppt)}</td>
        <td>${p.drugs.map(d=>`<div style="font-size:12px;margin:1px 0;"><span class="pill ${d.cat==='rescue'?'pr':'pg'}" style="font-size:10px;">${d.cat==='rescue'?'🔴':'🟢'}</span> ${d.name}</div>`).join('')}</td>
      </tr>`).join('')}
      </tbody></table>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;">
      <button class="btn bs" onclick="confirmImport()">✅ ยืนยันนำเข้า ${pts.length} ราย → คิวเภสัช</button>
      <button class="btn bgray" onclick="document.getElementById('import-preview').innerHTML=''">ยกเลิก</button>
    </div>`;
}

function confirmImport(){
  const pts=window._importData||[];
  if(!pts.length) return;
  let created=0,updated=0,skipped=0;
  pts.forEach(p=>{
    // 1. Create/update patient
    let pt=DB.patients.find(x=>x.hn===p.hn);
    if(!pt){
      pt={id:uid(),hn:p.hn,name:p.name,dx:normalizeDx(p.dx||'Asthma'),createdAt:new Date().toISOString()};
      if(p.age) pt.age=p.age;
      DB.patients.push(pt);
      created++;
    } else {
      updated++;
    }
    if(!p.drugs.length){skipped++;return;}

    // 2. Match/create drugs in DB
    const drugRefs=p.drugs.map(d=>{
      const nameLow=d.name.toLowerCase();
      const firstWord=nameLow.split(/[\s\/]/)[0];
      let dbDrug=DB.drugs.find(x=>{
        const xl=x.name.toLowerCase();
        return xl.includes(firstWord)||nameLow.includes(x.name.toLowerCase().split(/[\s\/]/)[0]);
      });
      if(!dbDrug){
        const cat=d.cat||guessDrugCat(d.name);
        dbDrug={id:uid(),name:d.name,dose:'',puffs:d.ppc||200,
          type:cat==='rescue'?'SABA':'ICS',cat,brand:'',
          color:cat==='rescue'?'#2196F3':'#4CAF50'};
        DB.drugs.push(dbDrug);
      }
      return {
        drugId:dbDrug.id,
        name:dbDrug.name,
        ppc:d.ppc||dbDrug.puffs||200,
        dosePerUse:d.dosePerUse||2,
        freqPerDay:d.freqPerDay||(d.cat==='rescue'?0:2),
        cat:d.cat||dbDrug.cat||'controller',
        expEmpty:d.expEmpty||null,
      };
    });

    // 3. Create visit based on import mode
    if(importMode==='db'){
      // DB mode: patient record only, no visit created
    } else {
      // Queue mode: create pending_nurse visit for today's appointments
      DB.visits.push({
        id:uid(),type:'import_queue',
        hn:p.hn,name:p.name,
        date:p.visitDate||today(),
        nextAppt:p.nextAppt,
        status:'pending_nurse',
        by:'import_excel',
        importDrugs:drugRefs,
        createdAt:new Date().toISOString(),
      });
    }
  });
  saveDB();
  window._importData=null;
  const modeLabel=importMode==='db'?'ฐานข้อมูล':'คิวพยาบาล';
  toast(`นำเข้าสำเร็จ (${modeLabel}): เพิ่มใหม่ ${created} ราย, อัปเดต ${updated} ราย`,'s');
  const prev=document.getElementById('import-preview');
  if(prev) prev.innerHTML=`
    <div class="al alo" style="margin-top:12px;">
      <span>✅</span>
      <div>
        <div style="font-weight:600;">นำเข้าข้อมูลสำเร็จ (${modeLabel})</div>
        <div style="font-size:13px;margin-top:4px;">เพิ่มผู้ป่วยใหม่ ${created} ราย · อัปเดต ${updated} ราย</div>
        ${importMode==='queue'?`
        <div style="font-size:13px;">ผู้ป่วยเข้าคิวพยาบาลแล้ว — ดูแบบประเมินได้จากคิว</div>
        <button class="btn bs" style="margin-top:10px;" onclick="switchNav('nqueue','vNurseQueue')">📥 ไปที่คิวพยาบาล →</button>`:`
        <div style="font-size:13px;">บันทึกเป็นฐานข้อมูลผู้ป่วยเรียบร้อย</div>
        <button class="btn bp" style="margin-top:10px;" onclick="switchNav('patients','vPatients')">👥 ดูรายชื่อผู้ป่วย →</button>`}
      </div>
    </div>`;
}

function rlFillName(){
  const hn=document.getElementById('rl-hn').value.trim();
  const p=DB.patients.find(x=>x.hn===hn);
  const row=document.getElementById('rl-name-row');
  if(p){document.getElementById('rl-name').textContent=p.name;row.style.display='block';}

let _rlSev=2;
function rlSetSev(n){
  _rlSev=n;
  document.getElementById('rl-sev').value=n;
  [1,2,3,4,5].forEach(i=>{
    const b=document.getElementById('rl-sev-'+i);
    if(!b)return;
    const cols=['#e8f5e9','#fff9c4','#fff3e0','#fce4ec','#ffebee'];
    const bds=['#43a047','#f9a825','#ef6c00','#c62828','#b71c1c'];
    b.style.background=i===n?cols[n-1]:'#fff';
    b.style.borderColor=i===n?bds[n-1]:'#ddd';
    b.style.color=i===n?bds[n-1]:'#333';
  });
}

function submitRescueLog(){
  const hn=document.getElementById('rl-hn').value.trim();
  const drugSel=document.getElementById('rl-drug').value;
  const drugOther=document.getElementById('rl-drug-other').value.trim();
  const puffs=parseInt(document.getElementById('rl-puffs').value)||0;
  const reason=document.querySelector('input[name="rl-reason"]:checked')?.value||'prn';
  const sev=parseInt(document.getElementById('rl-sev').value)||2;
  const note=document.getElementById('rl-note').value.trim();
  const errEl=document.getElementById('rl-err');

  if(!hn){errEl.textContent='กรุณาระบุ HN';errEl.style.display='block';return;}
  if(!drugSel){errEl.textContent='กรุณาเลือกยาพ่น';errEl.style.display='block';return;}
  if(puffs<1){errEl.textContent='กรุณาระบุจำนวน Puffs';errEl.style.display='block';return;}
  errEl.style.display='none';

  const d=DB.drugs.find(x=>x.id===drugSel);
  const drugName=drugSel==='__other'?drugOther:(d?d.name:drugSel);
  const p=DB.patients.find(x=>x.hn===hn);

  const entry={
    id:uid(),hn,name:p?p.name:'',drugId:drugSel==='__other'?null:drugSel,
    drugName,puffs,reason,severity:sev,note,
    recordedAt:new Date().toISOString()
  };
  if(!DB.rescueLog)DB.rescueLog=[];
  DB.rescueLog.push(entry);
  saveDB();

  document.getElementById('rl-success').style.display='block';
  document.querySelector('button[onclick="submitRescueLog()"]').style.display='none';
}

function vRescueHistory(){
  if(!DB.rescueLog)DB.rescueLog=[];
  const now=new Date();
  const last24h=new Date(now-86400000).toISOString();
  const last30d=new Date(now-30*86400000).toISOString();
  const thisYear=now.getFullYear();

  // alerts
  const alerts=[];
  // group by HN for alert checks
  const byHN={};
  DB.rescueLog.forEach(r=>{
    if(!byHN[r.hn])byHN[r.hn]={name:r.name,hn:r.hn,logs:[]};
    byHN[r.hn].logs.push(r);
  });
  Object.values(byHN).forEach(({hn,name,logs})=>{
    const last24=logs.filter(l=>l.recordedAt>=last24h);
    const puffs24=last24.reduce((s,l)=>s+l.puffs,0);
    if(puffs24>=4) alerts.push({hn,name,type:'puffs',msg:`ใช้ยาฉุกเฉิน ${puffs24} puffs ใน 24 ชม.`,sev:'e'});
    const exac30=logs.filter(l=>l.recordedAt>=last30d&&l.reason==='exacerbation');
    if(exac30.length>=2) alerts.push({hn,name,type:'exac',msg:`อาการกำเริบ ${exac30.length} ครั้ง ใน 30 วัน`,sev:'w'});
    // check recent (last 1h)
    const last1h=new Date(now-3600000).toISOString();
    const recent=logs.filter(l=>l.recordedAt>=last1h);
    if(recent.length>0) alerts.push({hn,name,type:'recent',msg:`เพิ่งใช้ยา ${recent.length} ครั้ง (1 ชม. ที่ผ่านมา)`,sev:'w'});
  });

  // canister stats this year — from dispensing
  const yearDisp=DB.dispensing.filter(d=>{
    const yr=new Date(d.date).getFullYear();

  const rescueDrugIds=new Set(DB.drugs.filter(d=>d.cat==='rescue').map(d=>d.id));

function qrSearchPatient(){

  const url=window.location.origin+window.location.pathname+'#rescue-'+encodeURIComponent(p.hn);
  const qrUrl='https://api.qrserver.com/v1/create-qr-code/?size=200x200&data='+encodeURIComponent(url);

    <div style="font-weight:600;margin-bottom:8px;">${p.hn} – ${p.name}</div>

function showRescuePatient(hn){
  if(!DB.rescueLog)DB.rescueLog=[];
  const logs=DB.rescueLog.filter(l=>l.hn===hn).sort((a,b)=>new Date(b.recordedAt)-new Date(a.recordedAt));
  const p=DB.patients.find(x=>x.hn===hn);
  const modal=document.getElementById('rescue-patient-modal');
  document.getElementById('rpm-title').textContent=`${hn} – ${p?p.name:''} (${logs.length} รายการ)`;
  const sevColor=['','#43a047','#f9a825','#ef6c00','#c62828','#b71c1c'];
  document.getElementById('rpm-body').innerHTML=logs.length===0?'<div style="text-align:center;color:#888;padding:20px;">ยังไม่มีบันทึก</div>':
    logs.map(r=>{

      </div>`;
    }).join('');

}

// ---- Rescue Alert Banner (shown in nurse/doctor/pharm views) ----
function getRescueAlertBanner(){
  if(!DB.rescueLog||!DB.rescueLog.length) return '';
  const now=new Date();
  const last1h=new Date(now-3600000).toISOString();
  const last24h=new Date(now-86400000).toISOString();
  const recent=DB.rescueLog.filter(l=>l.recordedAt>=last1h);
  const high24=[];
  const byHN={};
  DB.rescueLog.filter(l=>l.recordedAt>=last24h).forEach(l=>{
    if(!byHN[l.hn])byHN[l.hn]={hn:l.hn,name:l.name,puffs:0,exac:false};
    byHN[l.hn].puffs+=l.puffs;
    if(l.reason==='exacerbation')byHN[l.hn].exac=true;
  });
  Object.values(byHN).forEach(p=>{if(p.puffs>=4||p.exac)high24.push(p);});
  if(!recent.length&&!high24.length) return '';
  const items=[];
  if(recent.length) items.push(`<strong>${recent.length}</strong> รายการใหม่ (1 ชม.)`);
  high24.forEach(p=>{
    if(p.exac) items.push(`<span style="color:#b71c1c;font-weight:700;">🔴 ${p.hn} ${p.name} อาการกำเริบ!</span>`);
    else if(p.puffs>=4) items.push(`<span style="color:#e65100;">⚠️ ${p.hn} ใช้ยา ${p.puffs} puffs/24h</span>`);
  });
  return`<div style="padding:10px 14px;background:#fff3e0;border-left:4px solid #e65100;border-radius:4px;margin-bottom:12px;cursor:pointer;" onclick="switchNav('rescue','vRescueHistory')">
    🚨 <strong>แจ้งเตือนยาพ่นฉุกเฉิน:</strong> ${items.join(' · ')} <span style="float:right;font-size:12px;color:#888;">คลิกดูรายละเอียด →</span>
  </div>`;
}

  setContent(`

    <div class="ch"><span class="ct">🧪 ฐานข้อมูลยาพ่น</span>
      <button class="btn bp bsm" onclick="openDrugModal()">+ เพิ่มยา</button>
    </div>
    <div class="tw" id="drug-table-wrap">${renderDrugTable()}</div>
  </div>
  <div class="mo" id="drug-modal">
    <div class="mb" style="max-width:500px">
      <div class="mh"><h3 id="drug-modal-title">เพิ่มยา</h3><button class="mx" onclick="closeDrugModal()">×</button></div>
      <div class="mc">
        <div class="fgrid">
          <div class="fg"><label>ชื่อยา *</label><input id="dm-name" placeholder="ชื่อยา (brand)"></div>
          <div class="fg"><label>ขนาด (dose/puff)</label><input id="dm-dose" placeholder="เช่น 100, 160/4.5"></div>
          <div class="fg"><label>Puffs ต่อกระบอก</label><input type="number" id="dm-puffs" value="200" min="1"></div>
          <div class="fg"><label>ประเภท</label>
            <select id="dm-type"><option>SABA</option><option>ICS</option><option>ICS/LABA</option><option>LAMA</option><option>SAMA</option><option>LABA</option><option>Other</option></select>
          </div>
          <div class="fg"><label>ประเภทการใช้</label>
            <select id="dm-cat"><option value="rescue">🔴 ยาฉุกเฉิน (Rescue)</option><option value="controller">🟢 ยาควบคุม (Controller)</option></select>

    </div>

}
let editDrugId='';
function renderDrugTable(){
  if(!DB.drugs.length) return '<div style="padding:20px;text-align:center;color:var(--tm);">ยังไม่มียาในฐานข้อมูล</div>';
  return`<table><thead><tr><th>ชื่อยา</th><th>Dose</th><th>Puffs/กระบอก</th><th>ประเภท</th><th>การใช้</th><th>จัดการ</th></tr></thead><tbody>
  ${DB.drugs.map(d=>`<tr>
    <td><strong>${d.name}</strong><br><small style="color:var(--tm)">${d.brand||''}</small></td>
    <td>${d.dose} mcg</td><td>${d.puffs}</td>
    <td><span class="pill pb" style="background:${d.color}22;color:${d.color}">${d.type}</span></td>
    <td><span class="pill ${d.cat==='rescue'?'pr':'pg'}">${d.cat==='rescue'?'🔴 ฉุกเฉิน':'🟢 ควบคุม'}</span></td>
    <td>
      <button class="btn bp bsm" onclick="openDrugModal('${d.id}')">✏️</button>
      <button class="btn bd2 bsm" onclick="deleteDrug('${d.id}')">🗑️</button>
    </td>
  </tr>`).join('')}</tbody></table>`;
}
function openDrugModal(id){
  editDrugId=id||'';
  const d=id?DB.drugs.find(x=>x.id===id):null;
  document.getElementById('drug-modal-title').textContent=id?'แก้ไขยา':'เพิ่มยา';
  document.getElementById('dm-name').value=d?.name||'';
  document.getElementById('dm-dose').value=d?.dose||'';
  document.getElementById('dm-puffs').value=d?.puffs||200;
  document.getElementById('dm-type').value=d?.type||'SABA';
  document.getElementById('dm-cat').value=d?.cat||'rescue';
  document.getElementById('dm-brand').value=d?.brand||'';
  document.getElementById('dm-color').value=d?.color||'#2196F3';
  document.getElementById('drug-modal').classList.add('on');
}
function closeDrugModal(){document.getElementById('drug-modal').classList.remove('on');}
function saveDrug(){
  const name=document.getElementById('dm-name').value.trim();
  if(!name){toast('กรุณากรอกชื่อยา','e');return;}
  const obj={id:editDrugId||uid(),name,dose:document.getElementById('dm-dose').value,
    puffs:+document.getElementById('dm-puffs').value,type:document.getElementById('dm-type').value,
    cat:document.getElementById('dm-cat').value,brand:document.getElementById('dm-brand').value,
    color:document.getElementById('dm-color').value};
  if(editDrugId){const i=DB.drugs.findIndex(d=>d.id===editDrugId);if(i>=0)DB.drugs[i]=obj;}
  else DB.drugs.push(obj);
  saveDB();closeDrugModal();
  document.getElementById('drug-table-wrap').innerHTML=renderDrugTable();
  toast(editDrugId?'แก้ไขยาแล้ว ✅':'เพิ่มยาแล้ว ✅');
}
function deleteDrug(id){
  if(!confirm('ลบยานี้ออกจากฐานข้อมูล?')) return;
  DB.drugs=DB.drugs.filter(d=>d.id!==id);saveDB();
  document.getElementById('drug-table-wrap').innerHTML=renderDrugTable();
  toast('ลบยาแล้ว');
}

// ---- DASHBOARD ----
let ch1,ch2;
function vDash(){
  setContent(`
  <div class="sgrid">
    <div class="sc"><div class="sv" id="ds-pt">–</div><div class="sl2">👥 ผู้ป่วยทั้งหมด</div></div>
    <div class="sc g"><div class="sv" id="ds-vis">–</div><div class="sl2">🏥 Visit ทั้งหมด</div></div>
    <div class="sc o"><div class="sv" id="ds-pend">–</div><div class="sl2">⏳ รอดำเนินการ</div></div>
    <div class="sc r"><div class="sv" id="ds-unc">–</div><div class="sl2">⚠️ ควบคุมไม่ได้ (ACT≤19)</div></div>
  </div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;">
    <div class="card"><div class="ch"><span class="ct">📈 ACT Score รายเดือน</span></div><div style="height:220px"><canvas id="ch1"></canvas></div></div>
    <div class="card"><div class="ch"><span class="ct">🫧 Rescue puffs/สัปดาห์</span></div><div style="height:220px"><canvas id="ch2"></canvas></div></div>
  </div>
  <div class="card">
    <div class="ch"><span class="ct">📋 Visit ล่าสุด</span></div>
    <div class="tw"><table><thead><tr><th>วันที่</th><th>HN</th><th>ชื่อ</th><th>ACT</th><th>Day</th><th>Night</th><th>Rescue</th><th>Status</th></tr></thead>
    <tbody>${[...DB.visits].sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt)).slice(0,10).map(v=>`<tr>
      <td>${fmt(v.date)}</td><td><strong>${v.hn}</strong></td><td>${v.name||'–'}</td>
      <td><strong>${v.actScore||'–'}</strong></td><td>${v.daytime??'–'}</td><td>${v.nighttime??'–'}</td><td>${v.rescue??'–'}</td>
      <td><span class="pill ${v.status==='done'?'pg':v.status==='pending_pharm'?'py':'pb'}">${v.status==='done'?'✅ เสร็จ':v.status==='pending_pharm'?'💊 รอเภสัช':'📋 รอพยาบาล'}</span></td>
    </tr>`).join('')||'<tr><td colspan="8" style="text-align:center;color:var(--tm);">ยังไม่มีข้อมูล</td></tr>'}</tbody></table></div>
  </div>`);
  document.getElementById('ds-pt').textContent=DB.patients.length;
  document.getElementById('ds-vis').textContent=DB.visits.length;
  document.getElementById('ds-pend').textContent=DB.visits.filter(v=>v.status==='pending_nurse'||v.status==='pending_pharm').length;
  document.getElementById('ds-unc').textContent=DB.visits.filter(v=>v.actScore&&v.actScore<=19).length;
  renderCharts();
}
function getLast6(){const m=[];for(let i=5;i>=0;i--){const d=new Date();d.setMonth(d.getMonth()-i);m.push({y:d.getFullYear(),m:d.getMonth(),lbl:d.toLocaleDateString('th-TH',{month:'short',year:'2-digit'})});}return m;}
function renderCharts(){
  const mths=getLast6();
  const acts=mths.map(m=>{const vs=DB.visits.filter(v=>{if(!v.actScore)return false;const d=new Date(v.date||v.createdAt);return d.getMonth()===m.m&&d.getFullYear()===m.y;});return vs.length?Math.round(vs.reduce((a,v)=>a+v.actScore,0)/vs.length):null;});
  const resc=mths.map(m=>{const vs=DB.visits.filter(v=>{const d=new Date(v.date||v.createdAt);return d.getMonth()===m.m&&d.getFullYear()===m.y;});return vs.length?Math.round(vs.reduce((a,v)=>a+(v.rescue||0),0)/vs.length):0;});
  if(ch1)ch1.destroy();if(ch2)ch2.destroy();
  ch1=new Chart(document.getElementById('ch1').getContext('2d'),{type:'line',data:{labels:mths.map(m=>m.lbl),datasets:[{label:'ACT เฉลี่ย',data:acts,borderColor:'#1a6eb5',backgroundColor:'rgba(26,110,181,.1)',tension:.4,fill:true,pointRadius:4}]},options:{responsive:true,maintainAspectRatio:false,scales:{y:{min:5,max:25}},plugins:{legend:{display:false}}}});
  ch2=new Chart(document.getElementById('ch2').getContext('2d'),{type:'bar',data:{labels:mths.map(m=>m.lbl),datasets:[{label:'Rescue puffs',data:resc,backgroundColor:'rgba(245,124,0,.7)',borderRadius:5}]},options:{responsive:true,maintainAspectRatio:false,scales:{y:{beginAtZero:true}},plugins:{legend:{display:false}}}});
}

  setContent(`

    <div class="mc"><div class="fgrid">
      <div class="fg"><label>HN *</label><input id="pt-hn"></div>
      <div class="fg"><label>ชื่อ-สกุล *</label><input id="pt-name"></div>
      <div class="fg"><label>วันเกิด</label><input type="date" id="pt-dob"></div>
      <div class="fg"><label>เพศ</label><select id="pt-sex"><option>ชาย</option><option>หญิง</option></select></div>
      <div class="fg"><label>เบอร์โทร</label><input id="pt-phone"></div>
      <div class="fg"><label>การวินิจฉัย</label><select id="pt-dx"><option value="Asthma">Asthma</option><option value="COPD">COPD</option><option value="Asthma+COPD">ACO</option></select></div>
    </div></div>
    <div class="mf"><button class="btn bgray" onclick="document.getElementById('pt-modal').classList.remove('on')">ยกเลิก</button><button class="btn bs" onclick="addPt()">✅ บันทึก</button></div>
    </div>
  </div>`);
}
function renderPtTable(pts){
  if(!pts.length) return '<div style="text-align:center;padding:20px;color:var(--tm);">ยังไม่มีข้อมูลผู้ป่วย</div>';
  return`<table><thead><tr><th>HN</th><th>ชื่อ-สกุล</th><th>อายุ</th><th>โรค</th><th>Visit ล่าสุด</th><th>Action</th></tr></thead><tbody>
  ${pts.map(p=>{const lv=DB.visits.filter(v=>v.hn===p.hn).sort((a,b)=>new Date(b.date||b.createdAt)-new Date(a.date||a.createdAt))[0];
    const age=p.dob?Math.floor((Date.now()-new Date(p.dob))/(365.25*86400000)):'–';
    return`<tr><td><strong>${p.hn}</strong></td><td>${p.name}</td><td>${age}</td>
    <td><span class="pill pb">${p.dx||'–'}</span></td><td>${lv?fmt(lv.date||lv.createdAt):'ยังไม่มี'}</td>
    <td><button class="btn bp bsm" onclick="openPhDisp('${p.hn}','')">💊 จ่ายยา</button></td></tr>`;}).join('')}
  </tbody></table>`;
}
function filterPt(q){const b=document.getElementById('pt-body');if(!b)return;b.innerHTML=renderPtTable(DB.patients.filter(p=>!q||(p.hn+p.name).toLowerCase().includes(q.toLowerCase())));}
function openAddPt(){document.getElementById('pt-modal').classList.add('on');}
function addPt(){
  const hn=document.getElementById('pt-hn').value.trim();const name=document.getElementById('pt-name').value.trim();
  if(!hn||!name){toast('กรุณากรอก HN และชื่อ','e');return;}
  if(DB.patients.find(p=>p.hn===hn)){toast('HN นี้มีอยู่แล้ว','e');return;}
  DB.patients.push({id:uid(),hn,name,dob:document.getElementById('pt-dob').value,gender:document.getElementById('pt-sex').value,phone:document.getElementById('pt-phone').value,dx:document.getElementById('pt-dx').value,createdAt:new Date().toISOString()});
  saveDB();document.getElementById('pt-modal').classList.remove('on');
  document.getElementById('pt-body').innerHTML=renderPtTable(DB.patients);toast('เพิ่มผู้ป่วยแล้ว ✅');
}

function saveSettings(){
  const n=document.getElementById('set-nurse').value;const p=document.getElementById('set-pharm').value;
  const dr=document.getElementById('set-doctor').value;const a=document.getElementById('set-admin').value;
  if(n)DB.users.nurse=n;if(p)DB.users.pharmacist=p;if(dr)DB.users.doctor=dr;if(a)DB.users.admin=a;
  saveDB();toast('บันทึกรหัสผ่านแล้ว ✅');
}

// ---- TOAST ----
function toast(msg,type){
  const t=document.getElementById('toast');t.textContent=msg;
  t.style.background=type==='e'?'#d32f2f':'#388e3c';t.style.display='block';
  setTimeout(()=>t.style.display='none',3000);
}
