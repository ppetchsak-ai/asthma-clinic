<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Asthma/COPD Clinic</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--p:#1a6eb5;--pd:#0f4d8a;--pl:#e8f2fc;--s:#00897b;--sl:#e0f2f0;--ac:#f57c00;--dg:#d32f2f;--dl:#ffebee;--ok:#388e3c;--ol:#e8f5e9;--wn:#f9a825;--wl:#fffde7;--tx:#212529;--tm:#6c757d;--bd:#dee2e6;--bg:#f0f4f8;--cd:#fff;--r:10px;--sh:0 2px 12px rgba(0,0,0,.08);}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Segoe UI',Tahoma,sans-serif;font-size:14px;background:var(--bg);color:var(--tx);}
/* ---- LANDING ---- */
#pg-land{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--pd) 0%,var(--s) 100%);padding:20px;}
#pg-land h1{color:#fff;font-size:28px;font-weight:800;margin-bottom:6px;text-align:center;}
#pg-land p{color:rgba(255,255,255,.8);margin-bottom:32px;text-align:center;}
.land-cards{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;max-width:700px;}
.land-card{background:#fff;border-radius:14px;padding:24px 28px;cursor:pointer;text-align:center;width:160px;box-shadow:0 8px 32px rgba(0,0,0,.15);transition:.2s;}
.land-card:hover{transform:translateY(-4px);box-shadow:0 16px 40px rgba(0,0,0,.2);}
.land-card .lc-icon{font-size:36px;margin-bottom:10px;}
.land-card .lc-title{font-size:13px;font-weight:700;color:var(--pd);}
.land-card .lc-sub{font-size:11px;color:var(--tm);margin-top:3px;}
/* ---- APP SHELL ---- */
#app{display:none;min-height:100vh;display:flex;flex-direction:column;}
#topbar{background:linear-gradient(90deg,var(--pd),var(--p));color:#fff;padding:0 20px;height:52px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
#topbar .tb-left{display:flex;align-items:center;gap:12px;}
#topbar h1{font-size:15px;font-weight:700;}
.role-badge{padding:3px 10px;border-radius:12px;font-size:11px;font-weight:700;background:rgba(255,255,255,.2);}
#topbar .tb-right{display:flex;align-items:center;gap:8px;}
.btn-logout{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);color:#fff;padding:5px 12px;border-radius:6px;cursor:pointer;font-size:12px;}
.btn-logout:hover{background:rgba(255,255,255,.25);}
/* ---- TABS NAV ---- */
#tabnav{background:#fff;border-bottom:2px solid var(--bd);display:flex;gap:0;overflow-x:auto;padding:0 16px;}
.tnav{padding:12px 18px;font-size:13px;font-weight:600;cursor:pointer;color:var(--tm);border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap;transition:.15s;}
.tnav:hover{color:var(--p);}
.tnav.on{color:var(--p);border-bottom-color:var(--p);}
.tnav-r{color:#e65100 !important;}
.tnav-r:hover{color:#bf360c !important;}
.tnav-r.on{border-bottom-color:#e65100 !important;color:#bf360c !important;}
/* ---- CONTENT ---- */
#content{padding:20px;flex:1;}
.view{display:none;}.view.on{display:block;}
/* ---- CARDS ---- */
.card{background:#fff;border-radius:var(--r);box-shadow:var(--sh);padding:20px;margin-bottom:18px;}
.ch{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;padding-bottom:12px;border-bottom:2px solid var(--pl);}
.ct{font-size:15px;font-weight:700;color:var(--pd);display:flex;align-items:center;gap:7px;}
/* ---- STATS ---- */
.sgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:18px;}
.sc{background:#fff;border-radius:var(--r);padding:16px;box-shadow:var(--sh);border-left:4px solid var(--p);}
.sc.g{border-left-color:var(--s);}.sc.o{border-left-color:var(--ac);}.sc.r{border-left-color:var(--dg);}
.sv{font-size:30px;font-weight:800;color:var(--p);line-height:1;}
.sc.g .sv{color:var(--s);}.sc.o .sv{color:var(--ac);}.sc.r .sv{color:var(--dg);}
.sl2{font-size:12px;color:var(--tm);margin-top:5px;}
/* ---- FORM ---- */
.fg{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;}
.fg label{font-size:11px;font-weight:700;color:var(--tm);text-transform:uppercase;letter-spacing:.4px;}
.fg input,.fg select,.fg textarea{padding:9px 12px;border:1.5px solid var(--bd);border-radius:7px;font-size:13px;font-family:inherit;transition:.15s;background:#fff;}
.fg input:focus,.fg select:focus,.fg textarea:focus{outline:none;border-color:var(--p);box-shadow:0 0 0 3px rgba(26,110,181,.1);}
.fg textarea{resize:vertical;min-height:72px;}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;}
/* ---- BUTTONS ---- */
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:7px;font-size:13px;font-weight:600;cursor:pointer;border:none;transition:.15s;font-family:inherit;}
.bp{background:var(--p);color:#fff;}.bp:hover{background:var(--pd);}
.bs{background:var(--ok);color:#fff;}.bs:hover{background:#2e7d32;}
.bd2{background:var(--dg);color:#fff;}.bd2:hover{background:#b71c1c;}
.bo{background:transparent;color:var(--p);border:1.5px solid var(--p);}.bo:hover{background:var(--pl);}
.bw{background:var(--wn);color:#fff;}.bw:hover{background:#f57f17;}
.bsm{padding:5px 11px;font-size:12px;}
.bgray{background:#f0f0f0;color:#444;border:1px solid #ddd;}.bgray:hover{background:#e0e0e0;}
/* ---- TABLE ---- */
.tw{overflow-x:auto;}
table{width:100%;border-collapse:collapse;}
th{background:var(--pl);color:var(--pd);font-size:12px;font-weight:700;padding:9px 11px;text-align:left;white-space:nowrap;}
td{padding:9px 11px;border-bottom:1px solid var(--bd);font-size:13px;vertical-align:middle;}
tr:hover td{background:#f8fbff;}
/* ---- PILLS ---- */
.pill{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:700;}
.pg{background:var(--ol);color:var(--ok);}.py{background:var(--wl);color:#e65100;}.pr{background:var(--dl);color:var(--dg);}.pb{background:var(--pl);color:var(--p);}.pgr{background:#f0f0f0;color:#555;}
/* ---- MODAL ---- */
.mo{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:300;align-items:center;justify-content:center;}
.mo.on{display:flex;}
.mb{background:#fff;border-radius:var(--r);width:92%;max-width:680px;max-height:92vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.25);}
.mh{padding:16px 20px;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;background:linear-gradient(135deg,var(--pd),var(--p));color:#fff;border-radius:var(--r) var(--r) 0 0;}
.mh h3{font-size:15px;}
.mc{padding:20px;}
.mf{padding:12px 20px;border-top:1px solid var(--bd);display:flex;justify-content:flex-end;gap:8px;}
.mx{background:rgba(255,255,255,.2);border:none;color:#fff;width:28px;height:28px;border-radius:50%;cursor:pointer;font-size:17px;display:flex;align-items:center;justify-content:center;}
/* ---- ALERT ---- */
.al{padding:11px 14px;border-radius:7px;margin-bottom:12px;font-size:13px;display:flex;align-items:flex-start;gap:9px;}
.ali{background:var(--pl);border:1px solid #90caf9;color:var(--pd);}
.alw{background:var(--wl);border:1px solid #ffe082;color:#5d4037;}
.ald{background:var(--dl);border:1px solid #ef9a9a;color:var(--dg);}
.als{background:var(--ol);border:1px solid #a5d6a7;color:var(--ok);}
/* ---- ACT ---- */
.aq{background:#f8fbff;border:1.5px solid var(--bd);border-radius:8px;padding:14px;margin-bottom:10px;}
.aq p{font-size:13px;font-weight:600;margin-bottom:9px;}
.aopts{display:flex;gap:7px;flex-wrap:wrap;}
.ar{display:none;}.ar+label{padding:6px 12px;border:1.5px solid var(--bd);border-radius:6px;cursor:pointer;font-size:12px;transition:.15s;background:#fff;}
.ar:checked+label{background:var(--p);color:#fff;border-color:var(--p);}
/* ---- SCORE BOX ---- */
.sb{text-align:center;padding:16px;border-radius:10px;margin:10px 0;}
.sb .sn{font-size:44px;font-weight:900;line-height:1;}
.sb .sl3{font-size:13px;margin-top:5px;font-weight:600;}
.sc2{background:var(--ol);color:var(--ok);}.sp2{background:var(--wl);color:#e65100;}.su{background:var(--dl);color:var(--dg);}
/* ---- ADHERENCE ---- */
.adhq{padding:11px;border:1px solid var(--bd);border-radius:7px;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;gap:10px;}
.adhq p{font-size:13px;flex:1;}
.adhr{display:flex;gap:7px;}
.adhr input[type=radio]{display:none;}
.adhr label{padding:5px 12px;border:1.5px solid var(--bd);border-radius:5px;cursor:pointer;font-size:12px;font-weight:600;}
.adhr input:checked+label{background:var(--p);color:#fff;border-color:var(--p);}
/* ---- CANISTER STICKER ---- */
.sticker-preview{border:2px dashed var(--bd);border-radius:8px;padding:16px;margin-top:12px;}
.sticker-item{border:1.5px solid var(--p);border-radius:7px;padding:12px 14px;margin-bottom:8px;background:#fff;position:relative;}
.sticker-item.existing{border-color:var(--ac);background:#fff8f0;}
.atab-nav{display:flex;margin-bottom:0;border-radius:10px 10px 0 0;overflow:hidden;border:1.5px solid var(--bd);border-bottom:none;}
.atab-btn{flex:1;padding:10px 4px;font-size:12.5px;font-weight:700;border:none;cursor:pointer;background:#e8f2fc;color:var(--pd);border-right:1px solid var(--bd);transition:.2s;}
.atab-btn:last-child{border-right:none;}
.atab-btn.on{background:var(--p);color:#fff;}
.atab-panel{display:none;border:1.5px solid var(--bd);border-top:none;border-radius:0 0 10px 10px;padding:14px;margin-bottom:14px;background:#fff;}
.atab-panel.on{display:block;}
.consult-badge{background:#e65100;color:#fff;font-size:10px;font-weight:800;padding:2px 6px;border-radius:4px;}

.si-drug{font-size:13px;font-weight:800;color:var(--pd);margin-bottom:4px;}
.si-detail{font-size:12px;color:var(--tx);line-height:1.7;}
.si-badge{position:absolute;top:8px;right:10px;font-size:10px;font-weight:700;padding:2px 7px;border-radius:8px;}
/* ---- DRUG CARD ---- */
.drugcard{border:1.5px solid var(--bd);border-left:4px solid var(--p);border-radius:8px;padding:13px;margin-bottom:9px;background:#fff;}
/* ---- QUEUE ITEM ---- */
.qi{border:1px solid var(--bd);border-radius:8px;padding:13px;margin-bottom:8px;cursor:pointer;transition:.15s;}
.qi:hover{border-color:var(--p);background:var(--pl);}
.qi .qih{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px;}
/* ---- PRINT ---- */
@media print{
  body{background:#fff;}
  #pg-land,#topbar,#tabnav,.no-print,.btn,.card .ch button{display:none!important;}
  #content{padding:0;}
  .card{box-shadow:none;border:1px solid #ccc;margin-bottom:8px;padding:10px;}
  .print-sticker-wrap{display:block!important;}
  .sticker-print{width:90mm;border:1.5px solid #000;padding:5mm 6mm;margin:3mm;font-size:10pt;page-break-inside:avoid;}
  .sticker-print .sp-drug{font-size:12pt;font-weight:800;margin-bottom:2mm;}
  .sticker-print .sp-row{margin-bottom:1mm;}
}
.print-sticker-wrap{display:none;}
/* ---- LOGIN ---- */
#pg-login{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:400;display:none;align-items:center;justify-content:center;}
#pg-login.on{display:flex;}
.login-box{background:#fff;border-radius:14px;padding:28px;width:90%;max-width:360px;box-shadow:0 20px 60px rgba(0,0,0,.3);}
.login-box h2{font-size:18px;font-weight:800;color:var(--pd);margin-bottom:4px;text-align:center;}
.login-box p{text-align:center;color:var(--tm);font-size:13px;margin-bottom:20px;}
/* ---- TOAST ---- */
#toast{position:fixed;bottom:20px;right:20px;padding:11px 18px;border-radius:8px;font-size:13px;z-index:500;display:none;box-shadow:0 4px 16px rgba(0,0,0,.25);color:#fff;max-width:280px;}
/* ---- RESPONSIVE ---- */
@media(max-width:600px){.fgrid{grid-template-columns:1fr;}.sgrid{grid-template-columns:1fr 1fr;}}

/* ── Drug multi-select dropdown ── */
.drug-ms-wrap{position:relative;}
.drug-ms-box{display:flex;align-items:center;flex-wrap:wrap;gap:5px;min-height:36px;padding:5px 10px;border:1.5px solid var(--bd);border-radius:7px;cursor:pointer;background:#fff;font-size:13px;}
.drug-ms-box:hover{border-color:var(--p);}
.drug-ms-ph{color:#aaa;font-size:13px;}
.drug-tag{display:inline-flex;align-items:center;gap:4px;background:#e3f0ff;color:#1565c0;border-radius:10px;padding:2px 8px;font-size:12px;font-weight:600;}
.drug-tag .dx{cursor:pointer;color:#888;font-size:13px;line-height:1;}
.drug-tag .dx:hover{color:#c62828;}
.drug-ms-menu{position:absolute;left:0;top:100%;z-index:9998;background:#fff;border:1.5px solid var(--p);border-radius:8px;box-shadow:0 4px 16px rgba(0,0,0,.15);min-width:100%;max-height:220px;overflow-y:auto;margin-top:3px;}
.drug-ms-menu .dmi{display:flex;align-items:center;gap:8px;padding:8px 13px;cursor:pointer;font-size:13px;border-bottom:1px solid #f0f0f0;transition:.12s;}
.drug-ms-menu .dmi:last-child{border-bottom:none;}
.drug-ms-menu .dmi:hover{background:#f0f7ff;}
.drug-ms-menu .dmi.sel{background:#e8f5e9;}
.drug-ms-menu .dmi input[type=checkbox]{accent-color:var(--p);width:15px;height:15px;flex-shrink:0;}
.drug-ms-menu .dmi .dn{flex:1;}
.drug-ms-menu .dmi .dt{font-size:11px;color:var(--tm);background:#f5f5f5;border-radius:4px;padding:1px 6px;}

/* ── HN autocomplete suggest ── */
.hn-swrap{position:relative;display:block;}
.hn-suggest{position:absolute;left:0;top:100%;z-index:9999;background:#fff;border:1.5px solid #1976d2;border-radius:8px;box-shadow:0 4px 16px rgba(0,0,0,.18);max-height:230px;overflow-y:auto;min-width:100%;margin-top:2px;font-size:13px;}
.hn-suggest .si{padding:8px 13px;cursor:pointer;border-bottom:1px solid #f0f0f0;display:flex;gap:10px;align-items:center;}
.hn-suggest .si:last-child{border-bottom:none;}
.hn-suggest .si:hover,.hn-suggest .si.sih{background:#e3f0ff;}
.hn-suggest .si-hn{font-weight:700;color:#1565c0;min-width:58px;white-space:nowrap;}
.hn-suggest .si-nm{color:#333;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
</style>
</head>
<body>

<!-- ============ LANDING ============ -->
<div id="pg-land">
  <div style="font-size:52px;margin-bottom:10px;">🫁</div>
  <h1>Asthma/COPD Clinic</h1>
  <p>ระบบบันทึกและติดตามโรคหอบหืด</p>
  <div class="land-cards">
    <div class="land-card" onclick="goPublic()">
      <div class="lc-icon">📋</div>
      <div class="lc-title">ผู้ป่วย / อสม.</div>
      <div class="lc-sub">กรอกแบบประเมิน</div>
    </div>
    <div class="land-card" onclick="showLogin('nurse')">
      <div class="lc-icon">👩‍⚕️</div>
      <div class="lc-title">พยาบาล</div>
      <div class="lc-sub">ยืนยันข้อมูลผู้ป่วย</div>
    </div>
    <div class="land-card" onclick="showLogin('pharmacist')">
      <div class="lc-icon">💊</div>
      <div class="lc-title">เภสัชกร</div>
      <div class="lc-sub">จ่ายยา / คำนวณ</div>
    </div>
    <div class="land-card" onclick="showLogin('doctor')">
      <div class="lc-icon">🩺</div>
      <div class="lc-title">แพทย์</div>
      <div class="lc-sub">ดูสรุป / Plan</div>
    </div>
    <div class="land-card" onclick="showLogin('admin')">
      <div class="lc-icon">⚙️</div>
      <div class="lc-title">Admin</div>
      <div class="lc-sub">จัดการระบบ</div>
    </div>
  </div>
</div>

<!-- ============ LOGIN MODAL ============ -->
<div id="pg-login">
  <div class="login-box">
    <h2 id="login-title">เข้าสู่ระบบ</h2>
    <p id="login-sub">กรอกชื่อผู้ใช้และรหัสผ่าน</p>
    <div class="fg"><label>ชื่อผู้ใช้ (Username)</label>
      <input type="text" id="login-user" placeholder="ชื่อผู้ใช้" autocomplete="username" onkeydown="if(event.key==='Enter')document.getElementById('login-pw').focus()">
    </div>
    <div class="fg"><label>รหัสผ่าน</label>
      <input type="password" id="login-pw" placeholder="รหัสผ่าน" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
    </div>
    <div id="login-err" class="al ald" style="display:none"><span>❌</span><span>รหัสผ่านไม่ถูกต้อง</span></div>
    <div style="display:flex;gap:8px;margin-top:4px;">
      <button class="btn bp" style="flex:1" onclick="doLogin()">เข้าสู่ระบบ</button>
      <button class="btn bgray" onclick="closeLogin()">ยกเลิก</button>
    </div>
  </div>
</div>

<!-- ============ APP SHELL ============ -->
<div id="app" style="display:none">
  <div id="topbar">
    <div class="tb-left">
      <span style="font-size:22px;">🫁</span>
      <h1>Asthma Clinic</h1>
      <span class="role-badge" id="role-badge"></span>
    </div>
    <div class="tb-right">
      <span style="font-size:12px;color:rgba(255,255,255,.7);" id="tb-date"></span>
      <span id="sync-status" style="font-size:11px;padding:3px 8px;border-radius:8px;background:rgba(255,255,255,.1);"></span>
      <button class="btn-logout" onclick="if(confirm('ออกจากระบบ? \nจะล้างการจำ login ในเครื่องนี้ด้วย'))doLogout()">ออกจากระบบ</button>
    </div>
  </div>
  <div id="tabnav"></div>
  <div id="content"></div>
</div>

<!-- ============ TOAST ============ -->
<div id="toast"></div>

<script>
// ==================== SECURITY ====================
// 1) SHA-256 hashing
async function sha256hex(str){
  const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
async function migratePasswords(){
  const defaults={nurse:'N1234',pharmacist:'P1234',admin:'admin11091',doctor:'D1234'};
  // pwVersion<2 → force reset ALL role passwords to new defaults
  if((DB.pwVersion||0)<2){
    for(const [role,plain] of Object.entries(defaults)){
      DB.users[role]=await sha256hex(plain);
    }
    DB.pwVersion=2;saveDB();return;
  }
  // hash any remaining plaintext
  let changed=false;
  for(const [role,plain] of Object.entries(defaults)){
    if((DB.users[role]||'').length<40){DB.users[role]=await sha256hex(plain);changed=true;}
  }
  if(changed)saveDB();
}
// 2) Brute-force lockout
const _loginAttempts={};
const MAX_ATTEMPTS=5,LOCK_MS=5*60*1000;
function checkLocked(role){
  const a=_loginAttempts[role];if(!a)return false;
  if(a.count>=MAX_ATTEMPTS){const rem=Math.ceil((a.lockUntil-Date.now())/1000);if(rem>0)return rem;delete _loginAttempts[role];}
  return false;
}
function recordFail(role){
  if(!_loginAttempts[role])_loginAttempts[role]={count:0,lockUntil:0};
  _loginAttempts[role].count++;
  if(_loginAttempts[role].count>=MAX_ATTEMPTS)_loginAttempts[role].lockUntil=Date.now()+LOCK_MS;
}
function resetAttempts(role){delete _loginAttempts[role];}

// ── AUDIT LOG ──────────────────────────────────────────────────────────
function auditLog(action,userId,userName,detail){
  if(!DB.auditLog)DB.auditLog=[];
  DB.auditLog.unshift({id:uid(),ts:new Date().toISOString(),
    userId:userId||SESSION.userId||'?',
    userName:userName||SESSION.userName||'?',
    role:SESSION.role||'?',action,detail:detail||''});
  if(DB.auditLog.length>2000)DB.auditLog=DB.auditLog.slice(0,2000);
  saveDB();
}
function alog(action,detail){auditLog(action,SESSION.userId,SESSION.userName,detail);}
// ===== INLINE QR CODE GENERATOR (qrcode-generator MIT by kazuhikoarase, compacted) =====
(function(g){
var qrcode=function(typeNumber,ecLevel){
var PAD0=0xEC,PAD1=0x11;
var _tn=typeNumber,_ecl=QRErrorCorrectionLevel[ecLevel],_mod=null,_mc=0,_dc=null,_dl=[];
var _this={};
function makeImpl(test,mp){

function loadDB(){try{const d=localStorage.getItem(SK);if(d)DB=JSON.parse(d);}catch(e){}}
function saveDB(){
  try{localStorage.setItem(SK,JSON.stringify(DB));}catch(e){}
  if(SYNC.url) pushToCloud();
}
function loadSyncCfg(){
  try{const c=JSON.parse(localStorage.getItem(SYNC_CFG_KEY)||'{}');
    SYNC.url=c.url||'';SYNC.secret=c.secret||'';SYNC.autoSync=c.autoSync||false;SYNC.lastSync=c.lastSync||null;
  }catch(e){}
}
function saveSyncCfg(){
  try{localStorage.setItem(SYNC_CFG_KEY,JSON.stringify({url:SYNC.url,secret:SYNC.secret,autoSync:SYNC.autoSync,lastSync:SYNC.lastSync}));}catch(e){}
}
function syncUrl(){
  let u=SYNC.url.trim();
  if(!u) return null;
  if(!u.endsWith('.json')) u=u.replace(/\/+$/,'')+'/asthmadb.json';
  if(SYNC.secret) u+='?auth='+encodeURIComponent(SYNC.secret);
  return u;
}
async function pushToCloud(){
  const u=syncUrl(); if(!u) return;
  setSyncStatus('saving');
  try{
    const r=await fetch(u,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(DB)});
    if(!r.ok) throw new Error('HTTP '+r.status);
    SYNC.lastSync=new Date().toISOString();
    saveSyncCfg();
    setSyncStatus('ok');
  }catch(e){setSyncStatus('err',e.message);}
}
async function pullFromCloud(silent){
  const u=syncUrl(); if(!u) return false;
  if(!silent) setSyncStatus('loading');
  try{
    const r=await fetch(u);
    if(!r.ok) throw new Error('HTTP '+r.status);
    const remote=await r.json();
    if(remote&&remote.patients){
      DB=remote;
      localStorage.setItem(SK,JSON.stringify(DB));
      SYNC.lastSync=new Date().toISOString();
      saveSyncCfg();
      setSyncStatus('ok');
      return true;
    }
    setSyncStatus('ok');
    return false;
  }catch(e){setSyncStatus('err',e.message);return false;}
}

function parseTH(val){
  if(!val)return'';
  // Already ISO
  if(/^\d{4}-\d{2}-\d{2}$/.test(val))return val;
  const m=val.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/);
  if(!m)return val;
  let d=parseInt(m[1]),mo=parseInt(m[2]),y=parseInt(m[3]);
  if(y<100)y+=2500;
  if(y>2400)y-=543;
  return`${y}-${String(mo).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
}

function todayTH(){const n=new Date();return`${String(n.getDate()).padStart(2,'0')}/${String(n.getMonth()+1).padStart(2,'0')}/${n.getFullYear()}`;}
function addDaysTH(isoOrDate,n){
  const d=typeof isoOrDate==='string'?new Date(isoOrDate):isoOrDate;

}

function searchPtHistory(){
  const q=(document.getElementById('pth-search')?.value||'').toLowerCase();
  const ptMap={};
  DB.visits.forEach(v=>{
    if(!ptMap[v.hn])ptMap[v.hn]={hn:v.hn,name:v.name,dx:v.dx||getPatDx(v.hn),visits:[]};
    ptMap[v.hn].visits.push(v);
  });
  DB.patients.forEach(p=>{if(!ptMap[p.hn])ptMap[p.hn]={hn:p.hn,name:p.name,dx:p.dx,visits:[]};});
  const pts=q ? smartFilter(Object.values(ptMap), q, p=>p) : Object.values(ptMap);
  pts.sort((a,b)=>{
    const la=a.visits.sort((x,y)=>new Date(y.date)-new Date(x.date))[0]?.date||'';
    const lb=b.visits.sort((x,y)=>new Date(y.date)-new Date(x.date))[0]?.date||'';
    return lb.localeCompare(la);
  });
  const el=document.getElementById('pth-list');if(!el)return;
  el.innerHTML=pts.length?pts.map(p=>{
    const sorted=p.visits.sort((a,b)=>new Date(b.date)-new Date(a.date));
    const lastV=sorted[0];
    const lastScore=(()=>{const dx=normalizeDx(p.dx);if(!lastV)return'–';if(dx==='COPD')return lastV.catScore?`CAT ${lastV.catScore}`:lastV.actScore?`ACT ${lastV.actScore}`:'–';return lastV.actScore?`ACT ${lastV.actScore}`:'–';})();
    return`<div class="qi" onclick="showPtHistory('${p.hn}')">
      <div class="qih"><span><strong>${p.hn}</strong> – ${p.name}</span>${dxPill(p.dx||'Asthma')}</div>
      <div style="font-size:12px;color:var(--tm);">${p.visits.length} visits · ล่าสุด: ${lastV?fmt(lastV.date):'–'} · ${lastScore}</div>
    </div>`;}).join(''):'<div style="color:var(--tm);padding:16px;text-align:center;">ไม่พบข้อมูล</div>';
}
function showPtHistory(hn){
  const visits=DB.visits.filter(v=>v.hn===hn).sort((a,b)=>new Date(b.date)-new Date(a.date));
  const pt=DB.patients.find(p=>p.hn===hn)||{hn,name:visits[0]?.name||'–',dx:visits[0]?.dx||'Asthma'};
  const modal=document.getElementById('pth-modal');
  const titleEl=document.getElementById('pth-modal-title');
  const bodyEl=document.getElementById('pth-modal-body');
  if(!modal||!bodyEl)return;
  titleEl.textContent=`📂 ${pt.name} (HN: ${hn})`;
  const visitCards=visits.map((v,vidx)=>{
    const dx=normalizeDx(v.dx||getPatDx(v.hn));
    const isA=dx==='Asthma'||dx==='ACO';
    const isC=dx==='COPD'||dx==='ACO';
    const actPill=isA&&v.actScore!=null?`<span class="pill ${v.actScore>=20?'pg':v.actScore>=15?'py':'pr'}">ACT ${v.actScore}/25</span>`:'';
    const catPill=isC&&v.catScore!=null?`<span class="pill ${v.catScore<=10?'pg':v.catScore<=20?'py':'pr'}">CAT ${v.catScore}/40</span>`:'';
    const mmrcPill=isC&&v.mmrc!=null?`<span class="pill py" style="font-size:11px;">mMRC ${v.mmrc}</span>`:'';
    const adhPill=v.adherenceScore!=null?`<span class="pill ${v.adherenceScore===0?'pg':v.adherenceScore<=2?'py':'pr'}" style="font-size:11px;">Adh ${v.adherenceScore}/4</span>`:'';
    const stPill=v.status==='done'?'<span class="pill pg">✅ เสร็จสิ้น</span>':v.status==='pending_pharm'?'<span class="pill pb">💊 รอเภสัช</span>':v.status==='pending_doctor'?'<span class="pill py">🩺 รอแพทย์</span>':'<span class="pill pr">📋 รอยืนยัน</span>';
    const consultBadge=v.consultPharm?'<span class="consult-badge">CONSULT</span>':'';
    const ta=v.techAssessment;
    const techHtml=ta?`<div style="background:#e8f5e9;border-radius:7px;padding:8px 12px;margin-top:6px;font-size:12px;"><b>💨 เทคนิคพ่นยา (${(ta.type||'mdi').toUpperCase()}):</b> <span style="font-weight:700;color:${ta.score>=6?'#2e7d32':ta.score>=4?'#e65100':'#c62828'};">${ta.score}/7</span>${ta.note?`<br><span style="color:#555;">📝 ${ta.note}</span>`:''}</div>`:'';
    const disp=DB.dispensing.filter(d=>d.hn===hn).sort((a,b)=>new Date(b.date)-new Date(a.date)).find(d=>Math.abs(new Date(d.date)-new Date(v.date))<86400000*3);
    const dispHtml=disp?`<div style="background:#e8f2fc;border-radius:7px;padding:8px 12px;margin-top:6px;font-size:12px;"><b>💊 จ่ายยา (${fmtShort(disp.date)}):</b> ${(disp.drugs||[]).map(d=>`${d.drug} ${d.canisters?.filter(c=>!c.isOld).length||0} กระบอก`).join(', ')||'–'}</div>`:'';
    const retHtml=v.returnedInhalers?.length?`<div style="font-size:12px;color:#444;margin-top:5px;">🔄 <b>ยาคืน:</b> ${v.returnedInhalers.map(r=>`${r.drugName} ${r.qty} หลอด`).join(', ')}</div>`:'';
    const nurseNote=v.nurseNotes?`<div style="font-size:12px;color:#555;margin-top:5px;">👩‍⚕️ <b>พยาบาล:</b> ${v.nurseNotes}</div>`:'';
    const drNote=v.doctorNote?`<div style="font-size:12px;color:var(--pd);margin-top:5px;">🩺 <b>Note แพทย์:</b> ${v.doctorNote}</div>`:'';
    const drPlan=v.doctorPlan?`<div style="font-size:12px;color:var(--pd);margin-top:5px;">📋 <b>Plan:</b> ${v.doctorPlan}</div>`:'';
    const ptNote=v.notes?`<div style="font-size:12px;color:#666;margin-top:5px;">💬 <b>ผู้ป่วย:</b> ${v.notes}</div>`:'';
    return`<div style="border:1.5px solid ${vidx===0?'var(--p)':'var(--bd)'};border-radius:10px;overflow:hidden;margin-bottom:12px;">
      <div style="background:${vidx===0?'linear-gradient(135deg,var(--pd),var(--p))':'#f0f4ff'};color:${vidx===0?'#fff':'var(--pd)'};padding:10px 14px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px;">
        <span style="font-weight:800;font-size:13px;">📅 ${fmt(v.date)}${vidx===0?' <span style="font-size:10px;opacity:.8;">(ล่าสุด)</span>':''}</span>
        <div style="display:flex;gap:4px;flex-wrap:wrap;">${stPill}${consultBadge}</div>
      </div>
      <div style="padding:10px 14px;">
        <div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:6px;">${actPill}${catPill}${mmrcPill}${adhPill}${dxPill(v.dx||getPatDx(hn))}</div>
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:4px 16px;font-size:12px;margin-bottom:4px;">
          <div>💨 Reliever: <b>${v.rescue??'–'}/สัปดาห์</b></div>
          <div>🏠 ยาเหลือ: <b>${v.rescueLeft==='yes'?'✅ มี':v.rescueLeft==='no'?'❌ หมด':v.rescueLeft==='almost'?'⚠️ เกือบหมด':'–'}</b></div>
          ${v.erCount?`<div>🚑 ER: <b>${v.erCount} ครั้ง</b></div>`:''}
          ${v.admitCount?`<div>🏥 Admit: <b>${v.admitCount} ครั้ง</b></div>`:''}
        </div>
        ${nurseNote}${drNote}${drPlan}${ptNote}${retHtml}${techHtml}${dispHtml}
      </div>
    </div>`;
  }).join('');
  // Compile all returned inhalers across all visits
  const allReturns=[];
  visits.forEach(v=>{
    (v.returnedInhalers||[]).forEach(r=>{
      allReturns.push({date:v.date,drugName:r.drugName,drugId:r.drugId,qty:r.qty||1,
        price:(DB.drugs.find(d=>d.id===r.drugId||d.name===r.drugName)?.price||0)});
    });
  });
  const retSummaryByDrug={};
  allReturns.forEach(r=>{
    if(!retSummaryByDrug[r.drugName])retSummaryByDrug[r.drugName]={qty:0,value:0};
    retSummaryByDrug[r.drugName].qty+=r.qty;
    retSummaryByDrug[r.drugName].value+=r.qty*r.price;
  });
  const totalRetQty=allReturns.reduce((s,r)=>s+r.qty,0);
  const totalRetVal=allReturns.reduce((s,r)=>s+r.qty*r.price,0);

  const retSectionHtml=allReturns.length?`
    <div style="border:1.5px solid #a5d6a7;border-radius:10px;overflow:hidden;margin-bottom:14px;">
      <div style="background:#e8f5e9;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;" onclick="this.nextElementSibling.style.display=this.nextElementSibling.style.display==='none'?'block':'none'">

        <span style="color:#2e7d32;font-size:11px;">แตะเพื่อดู/ซ่อน ▼</span>

          ${Object.entries(retSummaryByDrug).map(([name,s])=>`<span style="background:#c8e6c9;border-radius:6px;padding:3px 10px;font-size:12px;color:#1b5e20;"><b>${name.length>20?name.slice(0,18)+'…':name}</b> · ${s.qty} หลอด${s.value>0?' · ฿'+s.value.toLocaleString():''}</span>`).join('')}
        </div>
        <table style="width:100%;font-size:12px;border-collapse:collapse;">
          <thead><tr style="background:#f1f8e9;"><th style="padding:5px 8px;text-align:left;border-bottom:1px solid #c8e6c9;">วันที่</th><th style="padding:5px 8px;text-align:left;border-bottom:1px solid #c8e6c9;">ยา</th><th style="padding:5px 8px;text-align:center;border-bottom:1px solid #c8e6c9;">จำนวน</th><th style="padding:5px 8px;text-align:right;border-bottom:1px solid #c8e6c9;">มูลค่า</th></tr></thead>
          <tbody>${allReturns.map(r=>`<tr><td style="padding:4px 8px;border-bottom:1px solid #f0f0f0;">${fmtShort(r.date)}</td><td style="padding:4px 8px;border-bottom:1px solid #f0f0f0;">${r.drugName}</td><td style="padding:4px 8px;text-align:center;border-bottom:1px solid #f0f0f0;">${r.qty} หลอด</td><td style="padding:4px 8px;text-align:right;border-bottom:1px solid #f0f0f0;">${r.price?'฿'+(r.qty*r.price).toLocaleString():'–'}</td></tr>`).join('')}</tbody>
        </table>
      </div>
    </div>`:'';

  bodyEl.innerHTML=`
    <div style="background:linear-gradient(135deg,var(--pd),var(--p));color:#fff;padding:12px 16px;border-radius:8px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;">
      <div><div style="font-size:16px;font-weight:800;">${pt.name}</div><div style="font-size:12px;opacity:.85;">HN: ${hn} · ${visits.length} visits · ${dxPill(pt.dx||getPatDx(hn))}</div></div>
    </div>
    ${retSectionHtml}
    ${visits.length?visitCards:'<div style="color:var(--tm);text-align:center;padding:30px;">ยังไม่มีประวัติ</div>'}`;
  modal.style.display='flex';
}

  document.getElementById('um-pw').value='';
  document.getElementById('um-err').style.display='none';
  document.getElementById('user-modal').style.display='flex';
}
async function saveUserAccount(){
  const username=document.getElementById('um-user').value.trim().toLowerCase();
  const name=document.getElementById('um-name').value.trim();
  const role=document.getElementById('um-role').value;
  const pw=document.getElementById('um-pw').value;
  const errEl=document.getElementById('um-err');
  if(!username){errEl.textContent='กรุณากรอก Username';errEl.style.display='block';return;}
  if(!/^[a-zA-Z0-9_.-]+$/.test(username)){errEl.textContent='Username ใช้ได้เฉพาะ a-z 0-9 _ . -';errEl.style.display='block';return;}
  if(!DB.userAccounts)DB.userAccounts=[];
  const dup=(DB.userAccounts||[]).find(u=>u.username===username&&u.id!==_editUserId);
  if(dup){errEl.textContent='Username นี้ถูกใช้แล้ว';errEl.style.display='block';return;}
  if(!_editUserId&&!pw){errEl.textContent='กรุณาตั้งรหัสผ่าน';errEl.style.display='block';return;}
  if(pw&&pw.length<4){errEl.textContent='รหัสผ่านต้องมีอย่างน้อย 4 ตัวอักษร';errEl.style.display='block';return;}
  if(_editUserId){
    const u=DB.userAccounts.find(x=>x.id===_editUserId);if(!u)return;
    u.username=username;u.name=name;u.role=role;
    if(pw)u.pwHash=await sha256hex(pw);
    alog('USER_EDIT','แก้ไข: '+username+' role:'+role);
  } else {
    const pwHash=await sha256hex(pw);
    DB.userAccounts.push({id:uid(),username,name,role,pwHash,active:true,createdAt:new Date().toISOString(),createdBy:SESSION.userId});
    alog('USER_ADD','เพิ่ม: '+username+' role:'+role);
  }
  saveDB();closeModal('user-modal');vUserAccounts();toast('บันทึกบัญชีผู้ใช้เรียบร้อย');
}
function toggleUserActive(id){
  const u=(DB.userAccounts||[]).find(x=>x.id===id);if(!u)return;
  u.active=!u.active;saveDB();
  alog(u.active?'USER_ENABLE':'USER_DISABLE','user: '+u.username);
  vUserAccounts();toast(u.active?'เปิดใช้งานแล้ว':'ระงับบัญชีแล้ว');
}
async function resetUserPw(id){
  const u=(DB.userAccounts||[]).find(x=>x.id===id);if(!u)return;
  const newPw=prompt('รหัสผ่านใหม่สำหรับ '+u.username+':');
  if(!newPw||newPw.length<4){toast('รหัสผ่านสั้นเกินไป','e');return;}
  u.pwHash=await sha256hex(newPw);saveDB();
  alog('USER_RESET_PW','reset pw: '+u.username);
  toast('รีเซ็ตรหัสผ่านเรียบร้อย');
}

function renderAuditTable(logs){
  if(!logs.length)return'<div style="text-align:center;padding:24px;color:var(--tm);">ยังไม่มีประวัติ</div>';
  const actionColor={LOGIN:'#1565c0',VISIT_CREATE:'#2e7d32',NURSE_VERIFY:'#1b5e20',DISPENSE:'#4527a0',RESCUE_LOG:'#b71c1c',PATIENT_ADD:'#e65100',USER_ADD:'#880e4f',USER_EDIT:'#880e4f',USER_DISABLE:'#c62828',DRUG_SAVE:'#827717'};
  return`<table><thead><tr><th>เวลา</th><th>User</th><th>Role</th><th>Action</th><th>รายละเอียด</th></tr></thead><tbody>
  ${logs.slice(0,500).map(l=>`<tr>
    <td style="font-size:11px;white-space:nowrap;">${new Date(l.ts).toLocaleString('th-TH',{dateStyle:'short',timeStyle:'short'})}</td>
    <td><strong style="color:${actionColor[l.action]||'#333'}">${l.userName||'?'}</strong></td>
    <td style="font-size:11px;">${{nurse:'พยาบาล',pharmacist:'เภสัชกร',doctor:'แพทย์',admin:'Admin',public:'Public'}[l.role]||l.role||'?'}</td>
    <td><code style="background:#f5f5f5;padding:1px 5px;border-radius:3px;font-size:11px;color:${actionColor[l.action]||'#555'}">${l.action}</code></td>
    <td style="font-size:12px;color:#555;">${l.detail||'–'}</td>
  </tr>`).join('')}</tbody></table>`;
}
function filterAudit(){
  const q=(document.getElementById('audit-q')?.value||'').toLowerCase();
  const role=document.getElementById('audit-role')?.value||'';
  const action=document.getElementById('audit-action')?.value||'';
  let logs=DB.auditLog||[];
  if(q)logs=logs.filter(l=>(l.userName+l.action+l.detail+l.userId).toLowerCase().includes(q));
  if(role)logs=logs.filter(l=>l.role===role);
  if(action)logs=logs.filter(l=>l.action.startsWith(action));
  const b=document.getElementById('audit-body');if(b)b.innerHTML=renderAuditTable(logs);
}

(function tryAutoLogin(){
  try{
    const s=JSON.parse(localStorage.getItem(SESS_KEY)||'null');
    if(!s||!s.role||!s.exp||Date.now()>s.exp){
      if(s)localStorage.removeItem(SESS_KEY);
      return;
    }
    if(s.exp-Date.now()<7*86400000){
      s.exp=Date.now()+SESS_DAYS*86400000;
      localStorage.setItem(SESS_KEY,JSON.stringify(s));
    }
    // pull cloud data first, then start
    if(SYNC.url){
      pullFromCloud(true).then(()=>{startApp(s.role,s.userId,s.displayName,s.userName);});
    } else {
      startApp(s.role,s.userId,s.displayName,s.userName);
    }
  }catch(e){}
})();

function showLogin(role){
  loginTarget=role;
  const titles={nurse:'พยาบาล',pharmacist:'เภสัชกร',admin:'Admin'};
  document.getElementById('login-title').textContent='เข้าสู่ระบบ – '+titles[role];
  document.getElementById('login-sub').textContent='กรอกรหัสผ่านสำหรับ'+titles[role];
  document.getElementById('login-user').value='';
  document.getElementById('login-pw').value='';
  document.getElementById('login-err').style.display='none';
  document.getElementById('pg-login').classList.add('on');
  setTimeout(()=>document.getElementById('login-user').focus(),100);
}
function closeLogin(){document.getElementById('pg-login').classList.remove('on');}
async function doLogin(){
  const username=(document.getElementById('login-user')?.value||loginTarget).trim();
  const pw=document.getElementById('login-pw').value;
  const errEl=document.getElementById('login-err');
  const lockKey=username||loginTarget;
  const rem=checkLocked(lockKey);
  if(rem){errEl.innerHTML='<span>🔒 ล็อกชั่วคราว กรุณารอ '+rem+' วินาที</span>';errEl.style.display='flex';return;}

  const hashed=await sha256hex(pw);
  let matchRole=null,matchUserId=null,matchUserName=null,matchDisplayName=null;

  // 1) Check DB.userAccounts (named users)
  const acc=(DB.userAccounts||[]).find(u=>u.active&&u.username.toLowerCase()===username.toLowerCase());
  if(acc){
    let pwOk=false;
    if(acc.pwHash.length<40){pwOk=(pw===acc.pwHash);if(pwOk){acc.pwHash=hashed;saveDB();}}
    else pwOk=(hashed===acc.pwHash);
    if(pwOk){matchRole=acc.role;matchUserId=acc.id;matchUserName=acc.username;matchDisplayName=acc.name||acc.username;}
  }

  // 2) Fallback: legacy role password
  if(!matchRole){
    const roleTarget=loginTarget||username;
    const stored=DB.users[roleTarget]||'';
    let pwOk=false;
    if(stored.length<40){pwOk=(pw===stored);if(pwOk){DB.users[roleTarget]=hashed;saveDB();}}
    else pwOk=(hashed===stored);
    if(pwOk){matchRole=roleTarget;matchUserId='role_'+roleTarget;matchUserName=roleTarget;matchDisplayName={nurse:'พยาบาล',pharmacist:'เภสัชกร',doctor:'แพทย์',admin:'Admin'}[roleTarget]||roleTarget;}
  }

  if(matchRole){
    resetAttempts(lockKey);closeLogin();
    auditLog('LOGIN',matchUserId,matchUserName,'เข้าสู่ระบบ role:'+matchRole);
    const remChk=document.getElementById('login-remember');
    if(remChk&&remChk.checked){
      try{localStorage.setItem(SESS_KEY,JSON.stringify({role:matchRole,userId:matchUserId,userName:matchUserName,displayName:matchDisplayName,exp:Date.now()+SESS_DAYS*86400000}));}catch(e){}
    }
    if(SYNC.url){
      pullFromCloud(true).then(()=>{startApp(matchRole,matchUserId,matchDisplayName,matchUserName);startAutoSync();});
    } else {
      startApp(matchRole,matchUserId,matchDisplayName,matchUserName);
    }
  } else {
    recordFail(lockKey);
    const rem2=checkLocked(lockKey);
    if(rem2)errEl.innerHTML='<span>🔒 ล็อก 5 นาที (ผิดครบ 5 ครั้ง)</span>';
    else{const left=MAX_ATTEMPTS-(_loginAttempts[lockKey]?.count||0);
      errEl.innerHTML='<span>❌ ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง (เหลือ '+left+' ครั้ง)</span>';}
    errEl.style.display='flex';
  }
}
function openLoginFor(role){
  loginTarget=role;
  const labels={nurse:'พยาบาล',pharmacist:'เภสัชกร',doctor:'แพทย์',admin:'Admin'};
  document.getElementById('login-title').textContent='เข้าสู่ระบบ — '+labels[role];
  document.getElementById('login-sub').textContent='กรอกชื่อผู้ใช้และรหัสผ่าน';
  document.getElementById('login-user').value=role;
  document.getElementById('login-pw').value='';

}

let activeNav='';
function buildNav(role){
  const items=NAVS[role]||NAVS.public;
  const nav=document.getElementById('tabnav');
  let spacerAdded=false;
  nav.innerHTML=items.map(n=>{
    let pre='';
    if(n.right&&!spacerAdded){pre='<div style="flex:1"></div><div style="width:1px;background:var(--bd);margin:8px 4px;"></div>';spacerAdded=true;}
    const cls=n.right?'tnav tnav-r':'tnav';
    return pre+`<div class="${cls}" id="tn-${n.id}" onclick="switchNav('${n.id}','${n.fn}')">${n.label}</div>`;
  }).join('');
  switchNav(items[0].id,items[0].fn);
}
function switchNav(id,fn){
  document.querySelectorAll('.tnav').forEach(t=>t.classList.remove('on'));
  const el=document.getElementById('tn-'+id);
  if(el) el.classList.add('on');
  activeNav=id;
  window[fn]&&window[fn]();
}

function _hnSugDrop(inputId){
  return document.getElementById(inputId+'-sug');
}
function showHNSuggest(inputId, nameId){
  const inp=document.getElementById(inputId);
  if(!inp) return;
  const q=inp.value.trim();
  let drop=_hnSugDrop(inputId);
  if(!drop){
    drop=document.createElement('div');
    drop.id=inputId+'-sug';
    drop.className='hn-suggest';
    drop.style.display='none';
    // wrap input in relative container
    let par=inp.parentElement;
    if(!par.classList.contains('hn-swrap')){
      const w=document.createElement('div');
      w.className='hn-swrap';
      par.insertBefore(w,inp);
      w.appendChild(inp);
      par=w;
    }
    par.appendChild(drop);
    inp.addEventListener('blur',()=>setTimeout(()=>{drop.style.display='none';},160));
    inp.addEventListener('keydown',e=>{
      if(e.key==='Escape'){drop.style.display='none';}
      else if(e.key==='ArrowDown'||e.key==='ArrowUp'){
        const items=[...drop.querySelectorAll('.si')];
        const cur=drop.querySelector('.sih');
        let idx=items.indexOf(cur);
        items.forEach(i=>i.classList.remove('sih'));
        if(e.key==='ArrowDown') idx=Math.min(idx+1,items.length-1);
        else idx=Math.max(idx-1,0);
        if(items[idx]){items[idx].classList.add('sih');items[idx].scrollIntoView({block:'nearest'});}
        e.preventDefault();
      } else if(e.key==='Enter'){
        const cur=drop.querySelector('.sih');
        if(cur){cur.dispatchEvent(new MouseEvent('mousedown',{bubbles:true}));e.preventDefault();}
      }
    });
  }
  if(!q){drop.style.display='none';return;}
  const res=smartFilter(DB.patients,q,p=>p).slice(0,7);
  if(!res.length){drop.style.display='none';return;}
  drop.innerHTML=res.map(p=>{
    const eHn=encodeURIComponent(p.hn||'');
    const eNm=encodeURIComponent(p.name||'');
    const eNid=encodeURIComponent(nameId||'');
    return `<div class="si" data-hn="${eHn}" data-nm="${eNm}" data-nid="${eNid}" onmousedown="hnSugPickEl(this,'${inputId}')"><span class="si-hn">${p.hn}</span><span class="si-nm">${p.name||''}</span></div>`;
  }).join('');
  drop.style.display='block';
}
function hnSugPick(inputId,hn,name,nameId){
  const inp=document.getElementById(inputId);
  if(inp) inp.value=hn;
  if(nameId){const n=document.getElementById(nameId);if(n)n.value=name;}
  const drop=_hnSugDrop(inputId);
  if(drop) drop.style.display='none';
  if(inputId==='a-hn') aFillName();
  else if(inputId==='ph-hn') phFillName();
  else if(inputId==='rl-hn') rlFillName();
  else if(inputId==='qr-hn-input') qrSearchPatient();
}
function hnSugPickEl(el,inputId){
  const hn=decodeURIComponent(el.dataset.hn||'');
  const nm=decodeURIComponent(el.dataset.nm||'');
  const nid=decodeURIComponent(el.dataset.nid||'');
  hnSugPick(inputId,hn,nm,nid);
}

function aFillName(){
  const hn=(document.getElementById('a-hn')||{}).value?.trim();
  const p=DB.patients.find(x=>x.hn===hn);
  if(p){
    if(document.getElementById('a-name'))document.getElementById('a-name').value=p.name;
    const dxSel=document.getElementById('a-dx');
    if(dxSel&&p.dx){
      const normalized=normalizeDx(p.dx);
      dxSel.value=normalized;
      onDxChange();
    }
  }
}
function normalizeDx(dx){
  if(!dx)return'Asthma';
  const d=dx.toLowerCase();
  if(d.includes('aco')||d.includes('overlap')||(d.includes('copd')&&d.includes('asthma')))return'ACO';
  if(d.includes('copd'))return'COPD';
  return'Asthma';
}

// ---- DX HELPERS ----
function getPatDx(hn){const p=DB.patients.find(x=>x.hn===hn);return p?.dx||'Asthma';}
function normalizeDx(dx){
  if(!dx)return'Asthma';
  const d=dx.toLowerCase();
  if(d.includes('aco')||d.includes('overlap')||(d.includes('copd')&&d.includes('asthma')))return'ACO';
  if(d.includes('copd'))return'COPD';
  return'Asthma';
}
function dxPill(dx){
  const n=normalizeDx(dx||'');
  if(n==='COPD')return'<span class="pill po" style="font-size:10px;">🫁 COPD</span>';
  if(n==='ACO')return'<span class="pill" style="font-size:10px;background:#ede7f6;color:#4527a0;">🔵 ACO</span>';
  return'<span class="pill pb" style="font-size:10px;">🌬️ Asthma</span>';
}
function scoreLabel(v){
  const dx=normalizeDx(v.dx||getPatDx(v.hn));
  const parts=[];
  if((dx==='Asthma'||dx==='ACO')&&v.actScore) parts.push('ACT: '+v.actScore);
  if((dx==='COPD'||dx==='ACO')&&v.catScore) parts.push('CAT: '+v.catScore);
  if((dx==='COPD'||dx==='ACO')&&v.mmrc!=null) parts.push('mMRC: '+v.mmrc);
  return parts.length?parts.join(' · '):'–';
}

function assessSummaryHTML(v){
  if(!v) return '';
  const day=v.daytime??null; const night=v.nighttime??null;
  const er=v.erCount??0; const admit=v.admitCount??0;
  const rescue=v.rescue??null;
  const hasData=(day!==null||v.actScore||v.catScore);
  if(!hasData) return '';
  const isHigh=v.wheezeHigh||(day!=null&&night!=null&&(day+night)>=2)||(er>=1)||(admit>=1);
  const bg=isHigh?'#fff3f3':'#f0fff4';
  const border=isHigh?'#ffcdd2':'#a5d6a7';
  const icon=isHigh?'🔴':'🟢';
  let rows=[];
  if(day!==null) rows.push(`หอบกลางวัน: <b>${day}</b> ครั้ง/สัปดาห์`);
  if(night!==null) rows.push(`กลางคืน: <b>${night}</b> ครั้ง`);
  if(rescue!==null) rows.push(`Reliever: <b>${rescue}</b> puffs/สัปดาห์`);
  if(er) rows.push(`ER: <b>${er}</b> ครั้ง`);
  if(admit) rows.push(`Admit: <b>${admit}</b> ครั้ง`);
  if(v.actScore) rows.push(`ACT: <b>${v.actScore}</b>/25`);
  if(v.catScore) rows.push(`CAT: <b>${v.catScore}</b>/40`);
  if(v.adherenceScore!=null) rows.push(`Adherence: <b>${v.adherenceScore}</b>/4`);
  const rLeft=v.rescueLeft;
  const rLabel=rLeft==='yes'?'💊 มียาเหลือ':rLeft==='no'?'❌ ยาหมด':rLeft==='almost'?'⚠️ เกือบหมด':'';
  if(rLabel) rows.push(rLabel);
  return `<div style="background:${bg};border:1.5px solid ${border};border-radius:7px;padding:8px 12px;margin-top:6px;font-size:12px;line-height:1.8;">
    <div style="font-weight:700;margin-bottom:3px;">${icon} ผลประเมินล่าสุด${isHigh?' — <span style=\"color:#c62828;\">⚠️ หอบบ่อย/ER</span>':' — <span style=\"color:#2e7d32;\">อาการน้อย</span>'}</div>
    ${rows.join(' · ')}
    ${v.notes?`<div style="color:#555;margin-top:3px;">📝 ${v.notes}</div>`:''}
  </div>`;
}

function fwdAllNurse(dest){
  if(!confirm(dest==='doctor'?'ส่งผู้ป่วยทั้งหมดไปพบแพทย์?':'ส่งผู้ป่วยทั้งหมดไปเภสัชโดยตรง?')) return;
  const target=dest==='doctor'?'pending_doctor':'pending_pharm';

function clearQueue(role){
  const statusMap={nurse:'pending_nurse',pharm:'pending_pharm',doctor:'pending_doctor'};
  const st=statusMap[role];
  if(!st||!confirm('เคลียร์คิวทั้งหมด? (จะ mark ว่าเสร็จสิ้น)')) return;
  DB.visits.filter(v=>v.status===st).forEach(v=>{v.status='done';v.clearedAt=new Date().toISOString();});
  saveDB();
  if(role==='nurse') vNurseQueue();
  else if(role==='doctor') vDoctorSummary();

}

function saveNurseVerify(){

  v.nighttime=+(document.getElementById('nv-night').value||0);
  v.rescue=+(document.getElementById('nv-rescue').value||0);
  v.erCount=+(document.getElementById('nv-er').value||0);

function saveDrPlan(vid){
  const v=DB.visits.find(x=>x.id===vid);if(!v)return;
  v.doctorPlan=document.getElementById('dr-plan-'+vid)?.value||'';
  v.doctorNote=document.getElementById('dr-note-'+vid)?.value||'';
  v.doctorAt=new Date().toISOString();
  if(v.status==='pending_doctor') v.status='pending_pharm';
  saveDB();toast('บันทึกแล้ว ✅');
}
function drNoteChip(vid,text){
  const ta=document.getElementById('dr-note-'+vid);
  if(!ta) return;
  if(text==='อื่นๆ (ระบุ)'){ta.focus();return;}
  const cur=ta.value.trim();
  // toggle: if already in text remove it, else add
  if(cur.includes(text)){
    ta.value=cur.replace(text,'').replace(/^[,;\s]+|[,;\s]+$/g,'').replace(/,\s*,/g,',');
  } else {
    ta.value=cur?cur+'; '+text:text;
  }
  // highlight active chips
  const chips=document.querySelectorAll(`#dr-note-chips-${vid} button`);
  chips.forEach(b=>{
    const active=ta.value.includes(b.textContent);
    b.style.background=active?'var(--ac)':'#fff';
    b.style.color=active?'#fff':'var(--p)';
  });
}
function fwdDrToPharm(vid){
  saveDrPlan(vid);
  const v=DB.visits.find(x=>x.id===vid);if(!v)return;
  v.status='pending_pharm';saveDB();
  toast('ส่งต่อเภสัชแล้ว ✅');
  vDoctorSummary();
}

function fwdAllDoctor(){
  if(!confirm('ส่งผู้ป่วยทั้งหมดไปเภสัช?')) return;

function openPhDisp(hn,vid){
  phHN=hn;phVisitId=vid;
  const v=DB.visits.find(x=>x.id===vid);
  vPhDisp();
  if(hn) document.getElementById('ph-hn').value=hn;

  const altVisit=DB.visits.filter(x=>x.hn===hn).sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt))[0];
  const resolvedName=(v?.name)||(ptRec?.name)||(altVisit?.name)||'';
  if(resolvedName) document.getElementById('ph-name').value=resolvedName;
  if(v?.nextAppt){document.getElementById('ph-next').value=v.nextAppt||'';syncThaiLabel('ph-next');}
  // Reset returned inhalers
  _phReturns=(v?.returnedInhalers||[]).slice();
  setTimeout(()=>{renderPhReturnList();},100);
  // Priority: import drugs > history > blank
  // Show doctor note if exists
  const noteBanner=document.getElementById('ph-doctor-note-banner');
  if(noteBanner&&v&&v.doctorNote){
    noteBanner.innerHTML=`<div class="al alw" style="margin-bottom:12px;"><span>📬</span><div><strong>Note จากแพทย์:</strong><br><span style="font-size:13px;">${v.doctorNote}</span></div></div>`;
  }
  // Rescue inhaler summary from nurse assessment
  const rescueBanner=document.getElementById('ph-rescue-banner');
  if(rescueBanner&&v){
    const rLeft=v.rescueLeft;
    const rPuffs=v.rescue??null;
    const rER=v.erCount??0;
    const rAdmit=v.admitCount??0;
    const scoreStr=(()=>{
      const dx=normalizeDx(v.dx||getPatDx(v.hn));
      if((dx==='Asthma'||dx==='ACO')&&v.actScore) return `ACT <b>${v.actScore}</b>/25`;
      if((dx==='COPD'||dx==='ACO')&&v.catScore) return `CAT <b>${v.catScore}</b>/40`;
      return null;
    })();
    // Severity colour: red if หมด/high use, yellow if almost/moderate
    const isUrgent=rLeft==='no'||(rPuffs!=null&&rPuffs>4);
    const isWarn=rLeft==='almost'||(rPuffs!=null&&rPuffs>=2&&rPuffs<=4);
    const bg=isUrgent?'#fff5f5':isWarn?'#fffde7':'#f0f4ff';
    const border=isUrgent?'#ef9a9a':isWarn?'#ffe082':'#90caf9';
    const icon=isUrgent?'🚨':isWarn?'⚠️':'💨';
    const leftLabel=rLeft==='yes'?'<span style="color:#2e7d32;">✅ ยังมีเหลือ</span>'
                   :rLeft==='no'?'<span style="color:#c62828;">❌ หมดแล้ว</span>'
                   :rLeft==='almost'?'<span style="color:#e65100;">⚠️ เกือบหมด</span>'
                   :'<span style="color:#666;">ไม่ทราบ</span>';
    rescueBanner.innerHTML=`
      <div style="background:${bg};border:1.5px solid ${border};border-radius:8px;padding:10px 14px;margin-bottom:12px;">
        <div style="font-weight:800;font-size:13px;margin-bottom:6px;">${icon} ข้อมูลยาพ่น Reliever (จากพยาบาล)</div>
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:6px 16px;font-size:12.5px;">
          <div>🫧 <b>ใช้ยา Reliever:</b> ${rPuffs!=null?rPuffs+' puffs/สัปดาห์':'ไม่ระบุ'}</div>
          <div>💊 <b>ยาเหลืออยู่:</b> ${leftLabel}</div>
          ${scoreStr?`<div>📊 <b>คะแนนล่าสุด:</b> ${scoreStr}</div>`:''}
          ${rER>0?`<div>🚑 <b>ER visits:</b> ${rER} ครั้ง</div>`:''}
          ${rAdmit>0?`<div>🏥 <b>Admit:</b> ${rAdmit} ครั้ง</div>`:''}
        </div>
        ${v.nurseNotes?`<div style="margin-top:6px;font-size:12px;color:#444;">📝 <b>บันทึกพยาบาล:</b> ${v.nurseNotes}</div>`:''}
        ${v.returnedInhalers&&v.returnedInhalers.length?`<div style="margin-top:6px;font-size:12px;color:#333;">🔄 <b>ยาที่คืน:</b> ${v.returnedInhalers.map(r=>r.drugName+' '+r.qty+'หลอด').join(', ')}</div>`:''}
      </div>`;
  }
  if(v&&v.type==='import'&&v.importDrugs&&v.importDrugs.length){
    // Pre-fill from Excel import data
    v.importDrugs.forEach(d=>{
      addPhDrug({
        drugId:d.drugId,
        mode:d.expEmpty?'cont':'new',
        lastEmptyDate:d.expEmpty||null,
        dosePerUse:d.dosePerUse||2,
        freqPerDay:d.freqPerDay||0,
        ppc:d.ppc||null,
      });
    });
  } else {
    const lastDisp=DB.dispensing.filter(d=>d.hn===hn).sort((a,b)=>new Date(b.date)-new Date(a.date));
    if(lastDisp.length){
      addPhDrugFromHistory(lastDisp[0]);
    } else {
      // Try to auto-fill from patient reliever/controller records
      const ptRec=DB.patients.find(x=>normHN(x.hn)===normHN(hn));
      const visitRec=DB.visits.find(x=>x.id===(typeof phVisitId!=='undefined'?phVisitId:''));
      const rescueLeft=visitRec?.rescueLeft||v?.rescueLeft||'unknown';
      let filled=false;
      if(ptRec){
        const relNames=(ptRec.reliever||'').split(',').map(s=>s.trim()).filter(Boolean);
        const ctrlNames=(ptRec.controller||'').split(',').map(s=>s.trim()).filter(Boolean);
        const allDrugNames=[...relNames,...ctrlNames];
        allDrugNames.forEach(nm=>{
          const drug=DB.drugs.find(d=>d.name===nm||nm.includes(d.brand||'__')||d.name.toLowerCase().includes(nm.toLowerCase().split(' ')[0]));
          if(drug){
            const isResc=drug.cat==='rescue';
            // If rescue drug and rescueLeft='yes' → qty=0 (still has some)
            const qty=isResc&&(rescueLeft==='yes'||rescueLeft==='almost')?0:1;
            addPhDrug({drugId:drug.id,mode:'new',dosePerUse:2,freqPerDay:isResc?0:2,qty:Math.max(qty,0)});
            // Force qty input value after DOM created
            if(qty===0){
              setTimeout(()=>{
                const el=document.querySelector('[id$="-qty"]');
                // find last qty input and set to 0 if rescue
                const allQty=document.querySelectorAll('[id$="-qty"]');
                if(allQty.length){allQty[allQty.length-1].value=0;calcAll();}
              },50);
            }
            filled=true;
          }
        });

function calcSingle(id){
  const drugSel=document.getElementById(id+'-drug');
  const drug=DB.drugs.find(d=>d.id===drugSel?.value)||DB.drugs[0];
  const dose=+(document.getElementById(id+'-dose')?.value||2);
  const freq=+(document.getElementById(id+'-freq')?.value||2);
  const ppc=+(document.getElementById(id+'-ppc')?.value||200);
  const mode=document.getElementById(id+'-mode')?.value||'new';
  const nextAppt=document.getElementById('ph-next')?.value||addDays(today(),90).toISOString().split('T')[0];
  const dispDate=document.getElementById('ph-date')?.value||today();
  const daily=dose*freq;
  const daysToAppt=Math.max(1,diffDays(dispDate,nextAppt));
  let canisters=[];

  // ---- RESCUE (PRN) short-circuit ----
  const isRescue=drug&&(drug.cat==='rescue'||guessDrugCat(drug.name||'')==='rescue');
  if(isRescue){
    const qty=+(document.getElementById(id+'-qty')?.value||1);
    for(let i=0;i<qty;i++){
      canisters.push({num:`กระบอกที่ ${i+1}`,start:new Date(dispDate),end:new Date(nextAppt),
        puffs:ppc,puffsPerCan:ppc,isOld:false,dose,freq:0,drug:drug.name,isPRN:true});
    }
    return{drug:drug.name,isRescue:true,qty,dose,ppc,canisters,noDispense:false,daysToAppt};
  }

  if(mode==='cont'){
    const expEmpty=document.getElementById(id+'-expempty')?.value||'';
    if(!expEmpty) return {drug:drug?.name,daily,daysToAppt,canisters:[],noDispense:false,noDate:true};
    const expEmptyD=new Date(expEmpty);
    const nextApptD=new Date(nextAppt);
    // If existing canister outlasts next appointment → no new dispensing needed
    if(expEmptyD>=nextApptD){
      return {drug:drug?.name,daily,daysToAppt,canisters:[],noDispense:true,expEmpty,dose,freq};
    }
    // New canisters start the day AFTER expected empty date
    const daysNeeded=Math.max(1,diffDays(expEmpty,nextAppt));
    const puffsNeeded=daysNeeded*daily;
    const n=Math.ceil(puffsNeeded/ppc);
    let startDate=addDays(expEmpty,1);
    for(let i=0;i<n;i++){
      const dur=Math.floor(ppc/daily);
      const end=addDays(startDate,dur-1);
      canisters.push({num:`กระบอกที่ ${i+1}`,start:new Date(startDate),end,puffs:ppc,isOld:false,dose,freq,drug:drug?.name});
      startDate=addDays(startDate,dur);
    }
    return {drug:drug?.name,daily,daysToAppt,canisters,noDispense:false,expEmpty,dose,freq};
  } else {
    // New prescription: start from dispDate
    const totalPuffs=daysToAppt*daily;
    const n=Math.ceil(totalPuffs/ppc);
    let startDate=new Date(dispDate);
    for(let i=0;i<n;i++){
      const dur=Math.floor(ppc/daily);
      const end=addDays(startDate,dur-1);
      canisters.push({num:`กระบอกที่ ${i+1}`,start:new Date(startDate),end,puffs:ppc,isOld:false,dose,freq,drug:drug?.name});
      startDate=addDays(startDate,dur);
    }
    return {drug:drug?.name,daily,daysToAppt,canisters,noDispense:false,dose,freq};
  }
}

  const ids=Array.from(document.getElementById('ph-drug-list')?.children||[]).map(el=>el.id);
  let allCanisters=[];let allResults=[];

    let html='';

        <span style="color:var(--ok);">จ่าย: <strong>${res.qty} กระบอก</strong></span>
        <span style="color:var(--tm);font-size:12px;"> · ครั้งละ ${res.dose} puffs · ${res.ppc} puffs/กระบอก (≈${Math.floor(res.ppc/res.dose)} ครั้ง)</span>
      </div>`;
    } else {
      html=`<div style="background:var(--ol);border:1px solid #a5d6a7;border-radius:6px;padding:8px 12px;">
        <strong>${res.drug}</strong> – ${res.daily} puffs/วัน<br>
        <span style="color:var(--ok);">จ่ายใหม่: <strong>${res.canisters.length} กระบอก</strong></span>
        ${res.expEmpty?`<br><span style="color:var(--tm);font-size:12px;">เริ่มกระบอกที่ 1 วันที่ ${res.canisters.length?fmtShort(res.canisters[0].start):'–'}</span>`:''}
      </div>`;
    }
    const r=document.getElementById(id+'-result');
    if(r) r.innerHTML=html;
    allCanisters.push(...res.canisters.map(c=>({...c,drugName:res.drug})));
  });
  const totalNew=allCanisters.filter(c=>!c.isOld).length;
  const noDispAll=allResults.length&&allResults.every(r=>r.noDispense);
  const res=document.getElementById('ph-calc-result');
  if(res&&(allCanisters.length||allResults.length)){
    if(noDispAll){
      res.innerHTML=`<div class="al als"><span>✅</span><span><strong>ไม่ต้องจ่ายยาเพิ่มทุกรายการ</strong> – ยาเดิมยังพอถึงวันนัดครั้งถัดไป</span></div>`;
    } else {
      res.innerHTML=`<div class="al als"><span>📊</span><span><strong>สรุป:</strong> จ่ายใหม่รวม <strong>${totalNew} กระบอก</strong> | ยา ${ids.length} รายการ</span></div>`;
    }
  }
  window._calcResult={allCanisters,allResults,noDispAll};
}
function fmtShort(d){if(!d)return'–';const dt=new Date(d);if(isNaN(dt))return'–';const dd=String(dt.getDate()).padStart(2,'0');const mm=String(dt.getMonth()+1).padStart(2,'0');const yy=dt.getFullYear()+543;return`${dd}/${mm}/${yy}`;}

  DB.dispensing.push({id:uid(),hn,name,date:document.getElementById('ph-date')?.value||today(),
    nextAppt:document.getElementById('ph-next')?.value||'',drugs,
    noDispense:cResult.noDispAll||false,
    createdAt:new Date().toISOString()});
  if(phVisitId){const v=DB.visits.find(x=>x.id===phVisitId);if(v){v.status='done';v.pharmAt=new Date().toISOString();}}
  if(!DB.patients.find(p=>p.hn===hn)) DB.patients.push({id:uid(),hn,name,dx:'Asthma',createdAt:new Date().toISOString()});
  saveDB();toast('บันทึกการจ่ายยาแล้ว ✅');
}

function filterPhHist(q){
  const raw=DB.dispensing.slice().sort((a,b)=>new Date(b.date)-new Date(a.date));

}

}

function setImportMode(mode){
  importMode=mode;
  const qEl=document.getElementById('imode-queue');
  const dbEl=document.getElementById('imode-db');
  if(!qEl||!dbEl) return;
  if(mode==='queue'){
    qEl.style.borderColor='var(--p)';qEl.style.background='var(--pl)';
    dbEl.style.borderColor='var(--bd)';dbEl.style.background='#fff';
  } else {
    dbEl.style.borderColor='var(--p)';dbEl.style.background='var(--pl)';
    qEl.style.borderColor='var(--bd)';qEl.style.background='#fff';
  }
}

function handleImportFile(input){
  if(typeof XLSX==='undefined'){
    toast('ไลบรารี XLSX ยังโหลดไม่เสร็จ กรุณาตรวจสอบการเชื่อมต่ออินเตอร์เน็ต แล้วรีเฟรชหน้า','e');
    return;
  }
  const file=input.files[0];
  if(!file){return;}
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array',cellDates:true});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:'',raw:false});
      if(rows.length<2){toast('ไม่พบข้อมูลในไฟล์','error');return;}
      previewImport(rows);
    }catch(err){toast('อ่านไฟล์ไม่ได้: '+err.message,'error');}
  };
  reader.readAsArrayBuffer(file);
}

function parseImportDate(val){
  if(!val) return null;
  const s=String(val).trim();
  if(!s||s==='-'||s==='–') return null;
  // ISO YYYY-MM-DD
  if(/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
  // D/M/YY or D/M/YYYY (Thai BE)
  const m4=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/);
  if(m4){
    let yr=parseInt(m4[3]);
    if(yr<100) yr+=2500;      // 2-digit BE: 69 → 2569
    if(yr>2400) yr-=543;      // BE → CE: 2569 → 2026
    return `${yr}-${m4[2].padStart(2,'0')}-${m4[1].padStart(2,'0')}`;
  }
  const d=new Date(s);
  if(!isNaN(d)) return d.toISOString().split('T')[0];
  return null;
}

// Auto-detect drug category from name
function guessDrugCat(name){
  const n=name.toLowerCase();
  const rescueKeys=['salbutamol','ventolin','berodual','bricanyl','ipratropium','atrovent','terbutaline','albuterol'];
  return rescueKeys.some(k=>n.includes(k))?'rescue':'controller';
}

function previewImport(rows){
  if(!rows||rows.length<2){toast('ไฟล์ไม่มีข้อมูล','error');return;}

  // Skip note row if row[1] starts with ⚠️
  let dataStart=1;
  if(rows[1]&&String(rows[1][0]||'').includes('⚠️')) dataStart=2;

  const hdr=rows[0].map(h=>String(h||'').replace(/\n.*/,'').toLowerCase().trim());

  // Header detection - support both new and old template formats
  function col(...keys){
    const i=hdr.findIndex(h=>keys.some(k=>h.includes(k)));
    return i>=0?i:-1;
  }
  const ci={
    date:    col('ว-ค-ป','วันที่','date'),
    name:    col('ชื่อผู้ป่วย','ชื่อ-นาม','ชื่อ','name'),
    hn:      col('hn','รหัส'),
    age:     col('อายุ','age'),
    drug:    col('ยาพ่น','ชื่อยา','drug'),
    nextAppt:col('วันนัด','next'),
    ppc:     col('puffs/กระบอก','puffs/can'),
    dpu:     col('พ่น/ครั้ง','dose per'),
    fpd:     col('ครั้ง/วัน','freq'),
    exp:     col('คาดว่า','exp','หมด'),
    dx:      col('วินิจ','diag'),
  };
  // Positional fallback: date,name,hn,age,drug,next,ppc,dpu,fpd,exp
  if(ci.date<0)    ci.date=0;
  if(ci.name<0)    ci.name=1;
  if(ci.hn<0)      ci.hn=2;
  if(ci.age<0)     ci.age=3;
  if(ci.drug<0)    ci.drug=4;
  if(ci.nextAppt<0)ci.nextAppt=5;
  if(ci.ppc<0)     ci.ppc=6;
  if(ci.dpu<0)     ci.dpu=7;
  if(ci.fpd<0)     ci.fpd=8;
  if(ci.exp<0)     ci.exp=9;

  const ptMap={};
  for(let i=dataStart;i<rows.length;i++){
    const r=rows[i];
    const hnRaw=String(r[ci.hn]||'').trim();
    if(!hnRaw) continue;
    if(!ptMap[hnRaw]){
      ptMap[hnRaw]={
        hn:hnRaw,
        name:String(r[ci.name]||'').trim(),
        age:parseInt(r[ci.age])||0,
        dx:normalizeDx(ci.dx>=0?String(r[ci.dx]||'Asthma').trim():'Asthma'),
        visitDate:parseImportDate(r[ci.date])||today(),
        nextAppt:parseImportDate(r[ci.nextAppt])||addDays(today(),90).toISOString().split('T')[0],
        drugs:[]
      };
    }
    const drugName=String(r[ci.drug]||'').trim();
    if(drugName){
      const cat=guessDrugCat(drugName);
      ptMap[hnRaw].drugs.push({
        name:drugName,
        cat,
        ppc:parseInt(r[ci.ppc])||200,
        dosePerUse:parseInt(r[ci.dpu])||2,
        freqPerDay:parseInt(r[ci.fpd])||(cat==='rescue'?0:2),
        expEmpty:parseImportDate(r[ci.exp])||null,
      });
    }
  }

  const pts=Object.values(ptMap);
  if(!pts.length){toast('ไม่พบข้อมูลที่อ่านได้ กรุณาตรวจสอบ format','error');return;}
  window._importData=pts;

  const prev=document.getElementById('import-preview');
  if(!prev) return;
  prev.innerHTML=`
    <div class="ch" style="margin:12px 0 8px;">
      <span class="ct" style="font-size:14px;">👁️ ตรวจสอบข้อมูลก่อนนำเข้า</span>
      <span class="pill pb">${pts.length} ผู้ป่วย · ${pts.reduce((a,p)=>a+p.drugs.length,0)} รายการยา</span>
    </div>
    <div class="tw" style="margin-bottom:14px;">
      <table><thead><tr>
        <th>HN</th><th>ชื่อผู้ป่วย</th><th>อายุ</th><th>วันนัด</th><th>ยาพ่น</th>
      </tr></thead><tbody>
      ${pts.map(p=>`<tr>
        <td><strong>${p.hn}</strong></td>
        <td>${p.name}</td>
        <td style="text-align:center">${p.age||'–'}</td>
        <td>${fmt(p.nextAppt)}</td>
        <td>${p.drugs.map(d=>`<div style="font-size:12px;margin:1px 0;"><span class="pill ${d.cat==='rescue'?'pr':'pg'}" style="font-size:10px;">${d.cat==='rescue'?'🔴':'🟢'}</span> ${d.name}</div>`).join('')}</td>
      </tr>`).join('')}
      </tbody></table>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;">
      <button class="btn bs" onclick="confirmImport()">✅ ยืนยันนำเข้า ${pts.length} ราย → คิวเภสัช</button>
      <button class="btn bgray" onclick="document.getElementById('import-preview').innerHTML=''">ยกเลิก</button>
    </div>`;
}

function confirmImport(){
  const pts=window._importData||[];
  if(!pts.length) return;
  let created=0,updated=0,skipped=0;
  pts.forEach(p=>{
    // 1. Create/update patient
    let pt=DB.patients.find(x=>x.hn===p.hn);
    if(!pt){
      pt={id:uid(),hn:p.hn,name:p.name,dx:normalizeDx(p.dx||'Asthma'),createdAt:new Date().toISOString()};
      if(p.age) pt.age=p.age;
      DB.patients.push(pt);
      created++;
    } else {
      updated++;
    }
    if(!p.drugs.length){skipped++;return;}

    // 2. Match/create drugs in DB
    const drugRefs=p.drugs.map(d=>{
      const nameLow=d.name.toLowerCase();
      const firstWord=nameLow.split(/[\s\/]/)[0];
      let dbDrug=DB.drugs.find(x=>{
        const xl=x.name.toLowerCase();
        return xl.includes(firstWord)||nameLow.includes(x.name.toLowerCase().split(/[\s\/]/)[0]);
      });
      if(!dbDrug){
        const cat=d.cat||guessDrugCat(d.name);
        dbDrug={id:uid(),name:d.name,dose:'',puffs:d.ppc||200,
          type:cat==='rescue'?'SABA':'ICS',cat,brand:'',
          color:cat==='rescue'?'#2196F3':'#4CAF50'};
        DB.drugs.push(dbDrug);
      }
      return {
        drugId:dbDrug.id,
        name:dbDrug.name,
        ppc:d.ppc||dbDrug.puffs||200,
        dosePerUse:d.dosePerUse||2,
        freqPerDay:d.freqPerDay||(d.cat==='rescue'?0:2),
        cat:d.cat||dbDrug.cat||'controller',
        expEmpty:d.expEmpty||null,
      };
    });

    // 3. Create visit based on import mode
    if(importMode==='db'){
      // DB mode: patient record only, no visit created
    } else {
      // Queue mode: create pending_nurse visit for today's appointments
      DB.visits.push({
        id:uid(),type:'import_queue',
        hn:p.hn,name:p.name,
        date:p.visitDate||today(),
        nextAppt:p.nextAppt,
        status:'pending_nurse',
        by:'import_excel',
        importDrugs:drugRefs,
        createdAt:new Date().toISOString(),
      });
    }
  });
  saveDB();
  window._importData=null;
  const modeLabel=importMode==='db'?'ฐานข้อมูล':'คิวพยาบาล';
  toast(`นำเข้าสำเร็จ (${modeLabel}): เพิ่มใหม่ ${created} ราย, อัปเดต ${updated} ราย`,'s');
  const prev=document.getElementById('import-preview');
  if(prev) prev.innerHTML=`
    <div class="al alo" style="margin-top:12px;">
      <span>✅</span>
      <div>
        <div style="font-weight:600;">นำเข้าข้อมูลสำเร็จ (${modeLabel})</div>
        <div style="font-size:13px;margin-top:4px;">เพิ่มผู้ป่วยใหม่ ${created} ราย · อัปเดต ${updated} ราย</div>
        ${importMode==='queue'?`
        <div style="font-size:13px;">ผู้ป่วยเข้าคิวพยาบาลแล้ว — ดูแบบประเมินได้จากคิว</div>
        <button class="btn bs" style="margin-top:10px;" onclick="switchNav('nqueue','vNurseQueue')">📥 ไปที่คิวพยาบาล →</button>`:`
        <div style="font-size:13px;">บันทึกเป็นฐานข้อมูลผู้ป่วยเรียบร้อย</div>
        <button class="btn bp" style="margin-top:10px;" onclick="switchNav('patients','vPatients')">👥 ดูรายชื่อผู้ป่วย →</button>`}
      </div>
    </div>`;
}

function submitRescueLog(){
  const hn=document.getElementById('rl-hn').value.trim();
  const puffs=parseInt(document.getElementById('rl-puffs').value)||0;
  const reason=document.querySelector('input[name="rl-reason"]:checked')?.value||'prn';
  const sev=parseInt(document.getElementById('rl-sev').value)||2;
  const note=document.getElementById('rl-note').value.trim();
  const errEl=document.getElementById('rl-err');

  if(!hn){errEl.textContent='กรุณาระบุ HN';errEl.style.display='block';return;}
  if(puffs<1){errEl.textContent='กรุณาระบุจำนวน Puffs';errEl.style.display='block';return;}
  errEl.style.display='none';

  const drugName='ยาพ่นฉุกเฉิน';
  const p=DB.patients.find(x=>x.hn===hn);

  const entry={
    id:uid(),hn,name:p?p.name:'',drugId:null,
    drugName,puffs,reason,severity:sev,note,
    recordedAt:new Date().toISOString()
  };
  if(!DB.rescueLog)DB.rescueLog=[];
  DB.rescueLog.push(entry);
  saveDB();

  document.getElementById('rl-success').style.display='block';
  document.querySelector('button[onclick="submitRescueLog()"]').style.display='none';
}

function vRescueHistory(){
  if(!DB.rescueLog)DB.rescueLog=[];
  const now=new Date();
  const last24h=new Date(now-86400000).toISOString();
  const last30d=new Date(now-30*86400000).toISOString();
  const thisYear=now.getFullYear();

  // alerts
  const alerts=[];
  // group by HN for alert checks
  const byHN={};
  DB.rescueLog.forEach(r=>{
    if(!byHN[r.hn])byHN[r.hn]={name:r.name,hn:r.hn,logs:[]};
    byHN[r.hn].logs.push(r);
  });
  Object.values(byHN).forEach(({hn,name,logs})=>{
    const last24=logs.filter(l=>l.recordedAt>=last24h);
    const puffs24=last24.reduce((s,l)=>s+l.puffs,0);
    if(puffs24>=4) alerts.push({hn,name,type:'puffs',msg:`ใช้ยาฉุกเฉิน ${puffs24} puffs ใน 24 ชม.`,sev:'e'});
    const exac30=logs.filter(l=>l.recordedAt>=last30d&&l.reason==='exacerbation');
    if(exac30.length>=2) alerts.push({hn,name,type:'exac',msg:`อาการกำเริบ ${exac30.length} ครั้ง ใน 30 วัน`,sev:'w'});
    // check recent (last 1h)
    const last1h=new Date(now-3600000).toISOString();
    const recent=logs.filter(l=>l.recordedAt>=last1h);
    if(recent.length>0) alerts.push({hn,name,type:'recent',msg:`เพิ่งใช้ยา ${recent.length} ครั้ง (1 ชม. ที่ผ่านมา)`,sev:'w'});

  // canister stats this year — from dispensing

function qrSearchPatient(){
  const q=document.getElementById('qr-hn-input').value.trim();
  if(!q){document.getElementById('qr-result').innerHTML='';return;}
  const p=DB.patients.find(x=>x.hn===q||x.name.includes(q));
  if(!p){document.getElementById('qr-result').innerHTML='<div style="color:#888;">ไม่พบผู้ป่วย</div>';return;}
  const url=window.location.origin+window.location.pathname+'#rescue-'+encodeURIComponent(p.hn);

// ---- Rescue Alert Banner (shown in nurse/doctor/pharm views) ----
function getRescueAlertBanner(){
  if(!DB.rescueLog||!DB.rescueLog.length) return '';
  const now=new Date();
  const last1h=new Date(now-3600000).toISOString();
  const last24h=new Date(now-86400000).toISOString();
  const recent=DB.rescueLog.filter(l=>l.recordedAt>=last1h);
  const high24=[];
  const byHN={};
  DB.rescueLog.filter(l=>l.recordedAt>=last24h).forEach(l=>{
    if(!byHN[l.hn])byHN[l.hn]={hn:l.hn,name:l.name,puffs:0,exac:false};
    byHN[l.hn].puffs+=l.puffs;
    if(l.reason==='exacerbation')byHN[l.hn].exac=true;
  });
  Object.values(byHN).forEach(p=>{if(p.puffs>=4||p.exac)high24.push(p);});
  if(!recent.length&&!high24.length) return '';
  const items=[];
  if(recent.length) items.push(`<strong>${recent.length}</strong> รายการใหม่ (1 ชม.)`);
  high24.forEach(p=>{
    if(p.exac) items.push(`<span style="color:#b71c1c;font-weight:700;">🔴 ${p.hn} ${p.name} อาการกำเริบ!</span>`);
    else if(p.puffs>=4) items.push(`<span style="color:#e65100;">⚠️ ${p.hn} ใช้ยา ${p.puffs} puffs/24h</span>`);
  });
  return`<div style="padding:10px 14px;background:#fff3e0;border-left:4px solid #e65100;border-radius:4px;margin-bottom:12px;cursor:pointer;" onclick="switchNav('rescue','vRescueHistory')">
    🚨 <strong>แจ้งเตือนยาพ่นฉุกเฉิน:</strong> ${items.join(' · ')} <span style="float:right;font-size:12px;color:#888;">คลิกดูรายละเอียด →</span>
  </div>`;
}

function getLast12(){
  const m=[];
  for(let i=11;i>=0;i--){
    const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-i);
    m.push({y:d.getFullYear(),mo:d.getMonth(),
      lbl:d.toLocaleDateString('th-TH',{month:'short',year:'2-digit'})});
  }
  return m;
}

// track chart instances
const _charts={};
function destroyChart(id){if(_charts[id]){_charts[id].destroy();delete _charts[id];}}
function mkChart(id,cfg){destroyChart(id);const c=document.getElementById(id);if(!c)return;_charts[id]=new Chart(c.getContext('2d'),cfg);}

function renderDashCharts(){
  const mths=getLast12();
  const lbls=mths.map(m=>m.lbl);

  // ── 1. Controlled vs Uncontrolled % per month ──────────────────────────
  const ctrlPct=[], unctrlPct=[];
  mths.forEach(m=>{
    const vs=DB.visits.filter(v=>{const d=new Date(v.date||v.createdAt);return d.getMonth()===m.mo&&d.getFullYear()===m.y;});
    // one entry per patient (latest in month)
    const byHN={};
    vs.forEach(v=>{if(!byHN[v.hn]||new Date(v.date||v.createdAt)>new Date(byHN[v.hn].date||byHN[v.hn].createdAt))byHN[v.hn]=v;});
    let c=0,u=0;
    Object.values(byHN).forEach(v=>{
      const act=v.actScore,cat=v.catScore;
      if(act!=null){act>=20?c++:u++;}else if(cat!=null){cat<=10?c++:u++;}
    });
    const tot=c+u;
    ctrlPct.push(tot?Math.round(c/tot*100):null);
    unctrlPct.push(tot?Math.round(u/tot*100):null);
  });
  mkChart('ch-ctrl',{type:'bar',data:{labels:lbls,datasets:[
    {label:'คุมได้ (%)',data:ctrlPct,backgroundColor:'rgba(67,160,71,.75)',borderRadius:4},
    {label:'คุมไม่ได้ (%)',data:unctrlPct,backgroundColor:'rgba(229,57,53,.65)',borderRadius:4}
  ]},options:{responsive:true,maintainAspectRatio:false,
    scales:{y:{min:0,max:100,ticks:{callback:v=>v+'%'}},x:{stacked:false}},
    plugins:{legend:{position:'bottom',labels:{boxWidth:12,font:{size:11}}}}}});

  // ── 2. ER + Admit per month ────────────────────────────────────────────
  const erData=mths.map(m=>DB.visits.filter(v=>{const d=new Date(v.date||v.createdAt);return d.getMonth()===m.mo&&d.getFullYear()===m.y;}).reduce((s,v)=>s+(v.erCount||0),0));
  const admData=mths.map(m=>DB.visits.filter(v=>{const d=new Date(v.date||v.createdAt);return d.getMonth()===m.mo&&d.getFullYear()===m.y;}).reduce((s,v)=>s+(v.admitCount||0),0));
  mkChart('ch-er',{type:'bar',data:{labels:lbls,datasets:[
    {label:'ER Visit',data:erData,backgroundColor:'rgba(245,124,0,.8)',borderRadius:4},
    {label:'Admit',data:admData,backgroundColor:'rgba(198,40,40,.75)',borderRadius:4}
  ]},options:{responsive:true,maintainAspectRatio:false,
    scales:{y:{beginAtZero:true,ticks:{stepSize:1}}},
    plugins:{legend:{position:'bottom',labels:{boxWidth:12,font:{size:11}}}}}});

  // ── 3. Drug usage – patients currently on each drug ───────────────────
  const drugCount={};
  const latestDisp={};
  DB.dispensing.forEach(d=>{if(!latestDisp[d.hn]||new Date(d.date)>new Date(latestDisp[d.hn].date))latestDisp[d.hn]=d;});
  Object.values(latestDisp).forEach(d=>{
    (d.drugs||[]).forEach(dr=>{const n=dr.name||dr.drug||'';if(n){drugCount[n]=(drugCount[n]||0)+1;}});
  });
  const drugNames=Object.keys(drugCount).sort((a,b)=>drugCount[b]-drugCount[a]).slice(0,10);
  const drugVals=drugNames.map(n=>drugCount[n]);
  const drugColors=drugNames.map((_,i)=>['#1976d2','#388e3c','#7b1fa2','#f57c00','#c62828','#0288d1','#558b2f','#ad1457','#ef6c00','#1565c0'][i%10]);
  mkChart('ch-drug',{type:'bar',data:{labels:drugNames.map(n=>n.length>22?n.slice(0,20)+'…':n),datasets:[{label:'จำนวนผู้ป่วย',data:drugVals,backgroundColor:drugColors,borderRadius:4}]},
    options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,
      scales:{x:{beginAtZero:true,ticks:{stepSize:1}}},
      plugins:{legend:{display:false}}}});

  // ── 4. Age distribution ───────────────────────────────────────────────
  const ageBuckets=[{lbl:'<18',min:0,max:17},{lbl:'18–40',min:18,max:40},{lbl:'41–60',min:41,max:60},{lbl:'61–80',min:61,max:80},{lbl:'>80',min:81,max:200}];
  const ageCount=ageBuckets.map(()=>0);
  const ageDrugMap=ageBuckets.map(()=>({}));
  const now=new Date();
  DB.patients.forEach(p=>{
    if(!p.dob)return;
    const age=Math.floor((now-new Date(p.dob))/(365.25*86400000));
    const bi=ageBuckets.findIndex(b=>age>=b.min&&age<=b.max);
    if(bi<0)return;
    ageCount[bi]++;
    const ld=latestDisp[p.hn];
    if(ld)(ld.drugs||[]).forEach(dr=>{const n=dr.name||dr.drug||'';if(n)ageDrugMap[bi][n]=(ageDrugMap[bi][n]||0)+1;});
  });
  mkChart('ch-age',{type:'bar',data:{labels:ageBuckets.map(b=>b.lbl),datasets:[{label:'จำนวนผู้ป่วย',data:ageCount,backgroundColor:'rgba(25,118,210,.7)',borderRadius:4}]},
    options:{responsive:true,maintainAspectRatio:false,scales:{y:{beginAtZero:true,ticks:{stepSize:1}}},plugins:{legend:{display:false}}}});
  const topEl=document.getElementById('age-top-drug');
  if(topEl)topEl.innerHTML='<div style="display:flex;flex-wrap:wrap;gap:4px;">'+ageBuckets.map((b,i)=>{
    const top=Object.entries(ageDrugMap[i]).sort((a,b2)=>b2[1]-a[1])[0];
    if(!top)return'';
    const dn=top[0].length>18?top[0].slice(0,16)+'…':top[0];
    return`<span style="background:#e3f2fd;border-radius:4px;padding:2px 6px;font-size:10px;"><b>${b.lbl}:</b> ${dn}</span>`;
  }).join('')+'</div>';

  // ── 5. Cost savings from returned inhalers ────────────────────────────
  function getDrugPrice(nameOrId){
    const d=DB.drugs.find(x=>x.id===nameOrId||x.name===nameOrId);
    return d?.price||0;
  }
  const savingsData=mths.map(m=>{
    let tot=0;
    DB.visits.forEach(v=>{
      const d=new Date(v.date||v.createdAt);
      if(d.getMonth()!==m.mo||d.getFullYear()!==m.y)return;
      (v.returnedInhalers||[]).forEach(r=>{
        const price=getDrugPrice(r.drugId)||getDrugPrice(r.drugName)||0;

      });
    });

  const totalSaved=savingsData.reduce((a,b)=>a+b,0);

  // ── 6. Technique assessment: pass vs reassess ─────────────────────────
  let techPass=0,techFail=0,techTotal=0;
  DB.visits.forEach(v=>{
    const ta=v.techAssessment;if(!ta)return;

  });
  mkChart('ch-tech',{type:'doughnut',data:{labels:['ผ่านประเมิน (≥5/7)','ประเมินซ้ำ (<5/7)'],datasets:[{data:[techPass,techFail],backgroundColor:['rgba(67,160,71,.8)','rgba(229,57,53,.7)'],borderWidth:1}]},

  // ── 7. Appointment: attended vs missed (last 12 months) ───────────────
  let apptKept=0,apptMissed=0;
  DB.dispensing.forEach(d=>{
    if(!d.nextAppt)return;
    const apptDate=new Date(d.nextAppt);
    // Check if patient has a visit within ±14 days of nextAppt
    const vis=DB.visits.filter(v=>v.hn===d.hn&&Math.abs(new Date(v.date||v.createdAt)-apptDate)<14*86400000);
    vis.length>0?apptKept++:apptMissed++;

  // ── 8. Emergency rescue per month (puffs) ────────────────────────────
  const rescData=mths.map(m=>(DB.rescueLog||[]).filter(r=>{const d=new Date(r.recordedAt);return d.getMonth()===m.mo&&d.getFullYear()===m.y;}).reduce((s,r)=>s+(r.puffs||0),0));

  const retByDrug={};

  DB.visits.forEach(v=>{

      const qty=r.qty||1;
      if(!retByDrug[n])retByDrug[n]={qty:0,value:0};
      retByDrug[n].qty+=qty;retByDrug[n].value+=qty*price;
      retRows.push({date:v.date,name:n,qty,value:qty*price});

  retRows.sort((a,b)=>new Date(b.date)-new Date(a.date));
  const retDrugNames=Object.keys(retByDrug).sort((a,b)=>retByDrug[b].qty-retByDrug[a].qty).slice(0,8);
  const retDrugQtys=retDrugNames.map(n=>retByDrug[n].qty);

  mkChart('ch-ret-drug',{type:'bar',data:{labels:retDrugNames.map(n=>n.length>18?n.slice(0,16)+'…':n),datasets:[
    {label:'กระบอก',data:retDrugQtys,backgroundColor:'rgba(56,142,60,.75)',borderRadius:4,yAxisID:'y'},
    {label:'มูลค่า (฿)',data:retDrugVals,backgroundColor:'rgba(25,118,210,.5)',borderRadius:4,yAxisID:'y2'}
  ]},options:{responsive:true,maintainAspectRatio:false,
    scales:{y:{beginAtZero:true,title:{display:true,text:'กระบอก'}},y2:{beginAtZero:true,position:'right',title:{display:true,text:'฿'},grid:{drawOnChartArea:false}}},
    plugins:{legend:{position:'bottom',labels:{boxWidth:10,font:{size:10}}}}}});

  const retTbl=document.getElementById('ret-detail-table');
  if(retTbl){
    const totalQ=retRows.reduce((s,r)=>s+r.qty,0);
